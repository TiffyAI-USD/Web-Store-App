<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webstore Pro - Cloud Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="TiffyAI Web-Store Builder">
<meta property="og:description" content="A high-performance, mobile-first WhatsApp POS and Web-Store Builder.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tiffyai-usd.github.io/Web-Store-App/v6.html">
<meta property="og:image" content="https://tiffyai-usd.github.io/Web-Store-App/WebApp.gif">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
:root{--gold:#d4a373;--gold2:#f1b86b;--whatsapp:#25D366}

/* Cloud & Auto-Save Indicators */
#autoSaveStatus {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 5000;
  font-size: 0.7rem;
  background: rgba(0,0,0,0.7);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--gold);
  color: var(--gold);
  display: none;
}

/* HEADER - PRECISION WIDTH 100.2% FOR RENDER ALIGNMENT */
header{
  min-height:80vh;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  width: 100.2%;
  margin-left: -0.1%;
}
header::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}
header *{position:relative;z-index:2}
.logo{
  max-width:180px;
  border-radius:16px;
  border:3px solid var(--gold);
  margin-bottom:1rem;
}
h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
.tagline{font-family:'Bebas Neue';color:var(--gold)}

/* CTA BUTTON */
.cta-container { margin-top: 25px; z-index: 10; }
.btn-cta {
    display: inline-block;
    background: linear-gradient(180deg, var(--gold), var(--gold2));
    color: #000;
    padding: 14px 30px;
    border-radius: 50px;
    font-family: 'Bebas Neue';
    text-decoration: none;
    font-size: 1.3rem;
    box-shadow: 0 5px 20px rgba(212, 163, 115, 0.4);
}

/* MENU GRID */
#menu{max-width:1200px;margin:auto;padding:4rem 5%}
.section-title{
  font-family:'Bebas Neue';
  font-size:2.4rem;
  color:var(--gold);
  margin:2rem 0 1rem;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.2rem;
}
.menu-item{
  background:#0f0f0f;
  border-radius:12px;
  border:1px solid #222;
  overflow:hidden;
  position: relative;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.marketing-active .menu-item {
  border: 1px solid var(--gold);
  transform: scale(1.02);
  box-shadow: 0 0 15px rgba(212, 163, 115, 0.2);
}

.badge {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 5px 12px;
  border-radius: 4px;
  font-family: 'Bebas Neue';
  font-size: 0.9rem;
  z-index: 4;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.badge-scarcity { background: #ff0000; color: #fff; animation: pulse-red 1.5s infinite; }
.badge-hot { background: var(--gold); color: #000; }
.badge-new { background: #3498db; color: #fff; }

@keyframes pulse-red {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
  70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
}

.status-saver-btn {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #25D366;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-family: 'Bebas Neue';
  cursor: pointer;
  z-index: 5;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

.rating-stars { color: #ffcc00; margin-bottom: 5px; font-size: 0.9rem; }

.menu-item img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-bottom:3px solid var(--gold);
}
.card{padding:1.2rem}
.menu-item h3{font-family:'Bebas Neue';color:var(--gold); font-size: 1.5rem; margin-bottom: 5px;}
.price{font-family:'Bebas Neue';color:var(--gold2); font-size: 1.3rem;}

/* EDITOR UI */
#editor {
  position: relative;
  border-top: 3px dashed var(--gold);
  padding: 3rem 5%;
  background-color: #0a0a0a;
  background-image: url('silky.jpeg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}
#editor::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 10, 10, 0.85);
  z-index: 1;
}
.editor-block {
  position: relative;
  z-index: 2;
  background: rgba(20, 20, 20, 0.95);
  padding: 1.5rem;
  border-radius: 14px;
  margin-bottom: 2rem;
  border: 1px solid #333;
}
label{display:block;margin-top:1.2rem;color:var(--gold); font-weight: bold; text-transform: uppercase; font-size: 0.8rem;}
input,textarea,select{
  width:100%;
  padding:12px;
  background:#111;
  border:1px solid #444;
  color:#fff;
  border-radius:8px;
  margin-top: 5px;
}
button{
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  border:none;
  padding:12px 20px;
  border-radius:30px;
  font-family:'Bebas Neue';
  font-size:1.1rem;
  cursor:pointer;
  margin-top:10px;
  position: relative;
  z-index: 2;
  transition: transform 0.2s;
}
button:active { transform: scale(0.95); }
.remove{background:#900;color:#fff}
.cloud-btn { background: #3498db; color: white; font-size: 0.8rem; margin-top: 5px;}
.dashboard-btn { background: #3498db; color: white; width: 100%; margin-bottom: 15px; display: block; text-align: center; border-radius: 10px;}

#whatsappOrderBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:999;
  background:linear-gradient(180deg,#25D366,#1ebe5d);
  color:#000;
  padding:16px 25px;
  border-radius:50px;
  font-family:'Bebas Neue';
  font-size:1.4rem;
  text-decoration:none;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

/* MODALS */
.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:5000; }
.hidden{display:none}
.modal-glass{
  width:90%; max-width:420px; background:#111; border:2px solid var(--gold); border-radius:20px; padding:2rem; color:#fff;
}
.pay-btn{ width:100%; padding:15px; border-radius:40px; margin-top:12px; font-family:'Bebas Neue'; font-size:1.2rem; cursor:pointer; border:none; text-align:center; display:block; text-decoration:none; }
.paypal{ background:#ffc439; color:#111; }
.confirm{ background:var(--gold); color:#111; }
</style>
</head>

<body>
<div id="autoSaveStatus">Saved Draft</div>

<div id="paymentModal" class="modal hidden">
  <div class="modal-glass">
    <h2 style="font-family:'Bebas Neue'; color:var(--gold); text-align:center; font-size:2.2rem;">Developer License</h2>
    <p style="text-align:center; margin:1rem 0; line-height:1.5;">$30 USD (≈ R499)<br>• 100 HTML Export Credits<br>• Professional WhatsApp Builder<br>• Priority Cloud Sync</p>
    <button class="pay-btn paypal" onclick="payWithPaypal()">Pay with PayPal</button>
    <button class="pay-btn confirm" onclick="confirmManualPayment()">I will send an EFT</button>
    <button style="background:none; color:#777; width:100%; border:none;" onclick="closePayment()">Dismiss</button>
  </div>
</div>

<header id="header">
  <img id="logo" class="logo">
  <h1 id="cafeName">LOADING BUSINESS...</h1>
  <p id="tagline" class="tagline">Mobile Web-Store</p>
  <div class="cta-container">
      <a href="#" id="ctaBtn" class="btn-cta" style="display:none;">ORDER NOW</a>
  </div>
</header>

<section id="menu">
  <div id="menuRender"></div>
</section>

<footer style="text-align:center; padding:3rem; border-top:1px solid #222; background:#000;">
  <p id="footerText">© 2026 YOUR BUSINESS</p>
</footer>

<div id="editor">
  <h2 style="font-family:'Bebas Neue';color:var(--gold); font-size: 2.5rem;">BUSINESS INFO</h2>
  <div class="editor-block">
    <div id="dashboardLink"></div>

    <label>Business Name</label>
    <input id="editName" oninput="document.getElementById('cafeName').textContent=this.value; saveDraft();">
    
    <label>Tagline</label>
    <input id="editTag" oninput="document.getElementById('tagline').textContent=this.value; saveDraft();">
    
    <label>Header Call to Action (CTA)</label>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <input id="ctaText" placeholder="Btn Text (SHOP NOW)" oninput="updateCTA(); saveDraft();">
        <input id="ctaUrl" placeholder="URL Link" oninput="updateCTA(); saveDraft();">
    </div>

    <label>Footer Copyright</label>
    <input id="editFooter" oninput="document.getElementById('footerText').textContent=this.value; saveDraft();">
    
    <label>Logo</label>
    <input id="logoURL" placeholder="Logo Image URL" oninput="document.getElementById('logo').src=this.value; saveDraft();">
    <button class="cloud-btn" onclick="this.nextElementSibling.click()">☁️ UPLOAD LOGO</button>
    <input type="file" style="display:none" onchange="uploadImage(this, img=>{document.getElementById('logo').src=img; document.getElementById('logoURL').value=img;})">

    <label>Header Banner</label>
    <input id="bannerURL" placeholder="Banner Image URL" oninput="document.getElementById('header').style.backgroundImage='url('+this.value+')'; saveDraft();">
    <button class="cloud-btn" onclick="this.nextElementSibling.click()">☁️ UPLOAD BANNER</button>
    <input type="file" style="display:none" onchange="uploadImage(this, img=>{document.getElementById('header').style.backgroundImage='url('+img+')'; document.getElementById('bannerURL').value=img;})">

    <label>WhatsApp Phone</label>
    <input id="editWA" placeholder="e.g. 27660000000" oninput="whatsappNumber=this.value.replace(/[^0-9]/g,''); saveDraft();">
    
    <label>Currency</label>
    <select id="editCurr" onchange="setCurrency(this.value); saveDraft();">
        <option value="ZAR">ZAR (R)</option>
        <option value="USD">USD ($)</option>
        <option value="INR">INR (₹)</option>
    </select>
  </div>

  <h2 style="font-family:'Bebas Neue';color:var(--gold); font-size: 2.5rem;">MENU BUILDER</h2>
  <div id="menuEditor"></div>
  <button onclick="addSection()" style="width:100%; background:#222; color:var(--gold); border:1px solid var(--gold);">+ NEW CATEGORY</button>
  <br><br>
  <button id="downloadBtn" onclick="downloadHTML()" style="width:100%; height:60px; font-size:1.4rem;">DOWNLOAD WEBSITE HTML</button>
  <button id="cloudSyncBtn" onclick="publishToCloud()" style="background:#3498db; width:100%; margin-top:10px;">☁️ SMART PUBLISH TO CLOUD</button>
</div>

<canvas id="statusCanvas" width="1080" height="1920" style="display:none;"></canvas>
<iframe id="printFrame" style="display:none;"></iframe>

<script>
/* ================== GLOBAL STATE ================== */
let whatsappNumber = "27660000000";
let activeCurrency = "ZAR";
let downloadCredits = parseInt(localStorage.getItem('tiffyai_credits')) || 0;
const orderState = {};
const currencyMap = { ZAR: 'R', USD: '$', INR: '₹', EUR: '€', GBP: '£' };

// CRITICAL FIX: menuSections must be globally accessible for the downloader to "Bake" it.
let menuSections = [{ title: "Featured", items: [{ name: 'Example Product', price: 150, desc: "High quality product.", img: "", rating: 5, badge: 'none' }] }];

function updateCTA() {
    const text = document.getElementById('ctaText').value;
    const url = document.getElementById('ctaUrl').value;
    const btn = document.getElementById('ctaBtn');
    if(text && url) {
        btn.textContent = text.toUpperCase();
        btn.href = url;
        btn.style.display = "inline-block";
    } else { btn.style.display = "none"; }
}

/* ================== THE DOWNLOADER (FIXED) ================== */
function downloadHTML() {
    if(localStorage.getItem('tiffyai_activated') !== 'true' && downloadCredits <= 0) {
        triggerPaymentFlow();
        return;
    }

    downloadCredits--;
    localStorage.setItem('tiffyai_credits', downloadCredits);
    updateCreditDisplay();

    // 1. Clone the current document
    const doc = document.documentElement.cloneNode(true);
    
    // 2. Remove Editor and Admin UI
    ['#editor', '#paymentModal', '#autoSaveStatus', '.support-btn'].forEach(sel => {
        const el = doc.querySelector(sel);
        if(el) el.remove();
    });

    // 3. THE "BAKING" FIX: 
    // We physically overwrite the default menuSections script inside the downloaded file 
    // so it contains YOUR current data forever.
    const script = doc.querySelector('script').cloneNode(true);
    let scriptContent = script.innerHTML;
    const bakedData = JSON.stringify(menuSections);
    scriptContent = scriptContent.replace(/let menuSections = \[.*?\];/, `let menuSections = ${bakedData};`);
    
    // Set WhatsApp and Currency too
    scriptContent = scriptContent.replace(/let whatsappNumber = ".*?";/, `let whatsappNumber = "${whatsappNumber}";`);
    scriptContent = scriptContent.replace(/let activeCurrency = ".*?";/, `let activeCurrency = "${activeCurrency}";`);
    
    doc.querySelector('script').innerHTML = scriptContent;

    const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'MyWebStore.html';
    a.click();
}

/* ================== CLOUD & DASHBOARD (FIXED) ================== */
async function publishToCloud() {
    const btn = document.getElementById('cloudSyncBtn');
    btn.textContent = "⏳ PUBLISHING...";
    
    let handle = localStorage.getItem('webstore_cloud_handle') || prompt("Enter Store Handle:");
    if(!handle) return;
    localStorage.setItem('webstore_cloud_handle', handle);

    const payload = {
        handle: handle,
        configData: {
            businessName: document.getElementById('cafeName').textContent,
            wa: whatsappNumber,
            curr: activeCurrency,
            menu: menuSections
        }
    };

    try {
        const res = await fetch("https://webstore-api-m8sr.onrender.com/api/publish", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.success) {
            window.prompt("🚀 STORE LIVE!", `https://webstore-api-m8sr.onrender.com/view/${handle}`);
        }
    } catch(e) { alert("Render is waking up. Try again in 20 seconds."); }
    finally { btn.textContent = "☁️ SMART PUBLISH TO CLOUD"; }
}

/* ================== CORE BUILDER LOGIC ================== */
function renderMenu() {
    const container = document.getElementById('menuRender');
    container.innerHTML = '';
    const sym = currencyMap[activeCurrency] || 'R';

    menuSections.forEach((sec, sIdx) => {
        const sectionHtml = `<h2 class="section-title">${sec.title}</h2><div class="menu-grid" id="grid-${sIdx}"></div>`;
        container.insertAdjacentHTML('beforeend', sectionHtml);
        
        const grid = document.getElementById(`grid-${sIdx}`);
        sec.items.forEach((it, iIdx) => {
            const key = `${sIdx}-${iIdx}`;
            const qty = orderState[key] || 0;
            const itemHtml = `
                <div class="menu-item">
                    <img src="${it.img || 'https://via.placeholder.com/300?text=Product'}">
                    <div class="card">
                        <h3>${it.name}</h3>
                        <div class="price">${sym}${it.price}</div>
                        <p style="font-size:0.8rem; color:#aaa; margin:10px 0;">${it.desc}</p>
                        <div style="display:flex; align-items:center; gap:15px;">
                            <button onclick="updateQty('${key}', -1)" style="padding:5px 15px;">-</button>
                            <span style="font-weight:bold; font-size:1.2rem;">${qty}</span>
                            <button onclick="updateQty('${key}', 1)" style="padding:5px 15px;">+</button>
                        </div>
                    </div>
                </div>`;
            grid.insertAdjacentHTML('beforeend', itemHtml);
        });
    });
    updateOrderButton();
}

function updateQty(key, delta) {
    orderState[key] = Math.max(0, (orderState[key] || 0) + delta);
    renderMenu();
}

function updateOrderButton() {
    const totalQty = Object.values(orderState).reduce((a, b) => a + b, 0);
    let btn = document.getElementById('whatsappOrderBtn');
    
    if(totalQty <= 0) { if(btn) btn.remove(); return; }
    
    if(!btn) {
        btn = document.createElement('a');
        btn.id = 'whatsappOrderBtn';
        document.body.appendChild(btn);
    }

    let summary = "🛍️ NEW ORDER\n\n";
    let grandTotal = 0;
    menuSections.forEach((sec, s) => {
        sec.items.forEach((it, i) => {
            const q = orderState[`${s}-${i}`];
            if(q > 0) {
                summary += `• ${q}x ${it.name} (${currencyMap[activeCurrency]}${it.price * q})\n`;
                grandTotal += (it.price * q);
            }
        });
    });
    summary += `\nTOTAL: ${currencyMap[activeCurrency]}${grandTotal}`;

    btn.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(summary)}`;
    btn.textContent = `SEND WHATSAPP ORDER (${totalQty})`;
}

/* ================== ADMIN TOOLS ================== */
function renderEditor() {
    const container = document.getElementById('menuEditor');
    container.innerHTML = '';
    menuSections.forEach((sec, sIdx) => {
        const div = document.createElement('div');
        div.className = 'editor-block';
        div.innerHTML = `
            <div style="display:flex; gap:10px;">
                <input value="${sec.title}" oninput="menuSections[${sIdx}].title=this.value; renderMenu();" style="font-weight:bold; color:var(--gold);">
                <button class="remove" onclick="menuSections.splice(${sIdx},1); renderEditor(); renderMenu();">✕</button>
            </div>
            ${sec.items.map((it, iIdx) => `
                <div style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">
                    <label>Item Name</label><input value="${it.name}" oninput="menuSections[${sIdx}].items[${iIdx}].name=this.value; renderMenu();">
                    <label>Price</label><input type="number" value="${it.price}" oninput="menuSections[${sIdx}].items[${iIdx}].price=this.value; renderMenu();">
                    <label>Image URL</label><input value="${it.img}" oninput="menuSections[${sIdx}].items[${iIdx}].img=this.value; renderMenu();">
                    <button class="remove" style="font-size:0.7rem;" onclick="menuSections[${sIdx}].items.splice(${iIdx},1); renderEditor(); renderMenu();">Delete Item</button>
                </div>
            `).join('')}
            <button onclick="menuSections[${sIdx}].items.push({name:'New Item',price:0,desc:'',img:'',rating:5}); renderEditor(); renderMenu();" style="background:#444; margin-top:10px;">+ ADD ITEM</button>
        `;
        container.appendChild(div);
    });
}

function addSection() { menuSections.push({title: "New Category", items: []}); renderEditor(); }

function saveDraft() {
    const data = {
        name: document.getElementById('editName').value,
        tag: document.getElementById('editTag').value,
        wa: whatsappNumber,
        curr: activeCurrency,
        menu: menuSections,
        logo: document.getElementById('logoURL').value,
        banner: document.getElementById('bannerURL').value
    };
    localStorage.setItem('webstore_pro_draft', JSON.stringify(data));
    const status = document.getElementById('autoSaveStatus');
    status.style.display = 'block';
    setTimeout(() => status.style.display = 'none', 1000);
}

function updateCreditDisplay() {
    const btn = document.getElementById('downloadBtn');
    const dash = document.getElementById('dashboardLink');
    if(localStorage.getItem('tiffyai_activated') === 'true') {
        btn.textContent = `DOWNLOAD WEBSITE HTML (${downloadCredits}/100)`;
        if(dash) dash.innerHTML = `<button class="dashboard-btn" onclick="window.open('https://webstore-api-m8sr.onrender.com/', '_blank')">📊 OPEN CLOUD DASHBOARD</button>`;
    } else {
        btn.textContent = "ACTIVATE DEVELOPER LICENSE";
        btn.style.background = "#600";
    }
}

function triggerPaymentFlow(){ document.getElementById('paymentModal').classList.remove('hidden'); }
function closePayment(){ document.getElementById('paymentModal').classList.add('hidden'); }

document.addEventListener('DOMContentLoaded', () => {
    // Load local storage if it exists
    const saved = localStorage.getItem('webstore_pro_draft');
    if(saved) {
        const d = JSON.parse(saved);
        menuSections = d.menu;
        whatsappNumber = d.wa;
        activeCurrency = d.curr;
        document.getElementById('editName').value = d.name;
        document.getElementById('editTag').value = d.tag;
        document.getElementById('logoURL').value = d.logo || '';
        document.getElementById('bannerURL').value = d.banner || '';
        document.getElementById('cafeName').textContent = d.name;
        document.getElementById('tagline').textContent = d.tag;
        document.getElementById('logo').src = d.logo || '';
        document.getElementById('header').style.backgroundImage = `url(${d.banner})`;
    }
    updateCreditDisplay();
    renderMenu();
    renderEditor();
});
</script>
</body>
</html>
