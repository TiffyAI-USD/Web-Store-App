<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Store Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
/* === ORIGINAL STYLES UNCHANGED === */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
h1,h2,h3{font-family:'Bebas Neue',cursive;color:#d4a373}

.section-title{font-size:2.4rem;margin:2rem 0 1rem}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}

.menu-item{background:#0f0f0f;border-radius:12px;overflow:hidden;border:1px solid #222}
.menu-item img{width:100%;height:200px;object-fit:cover;border-bottom:3px solid #d4a373}
.menu-item .card{padding:1rem}
.menu-item h3{font-size:1.2rem}
.price{color:#e6b880}

#editor{margin-top:80px;padding:40px;background:#0f0f0f;border-top:3px dashed #d4a373}
.editor-section{background:#1e1e1e;padding:20px;border-radius:12px;margin-bottom:24px}
.editor-section input{width:100%;padding:10px;margin-top:6px;background:#222;color:#fff;border:1px solid #444;border-radius:6px}

.section-header{display:flex;gap:10px;align-items:center}
.section-header input{flex:1;font-size:1.2rem;font-weight:bold}
.remove-btn{background:#900;color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer}
.add-btn{background:#d4a373;color:#000;padding:12px 24px;border:none;border-radius:30px;font-size:1.1rem;cursor:pointer}
</style>
</head>

<body>

<header style="padding:60px;text-align:center">
<h1>PAPA RON'S CAFÉ</h1>
<p>FOOD • GOOD MUSIC</p>
</header>

<section id="menu">
  <div id="menuSections"></div>
</section>
<script>
const menuSections = [
  {
    title: "PIZZAS",
    items: [
      { name:"SOMETHING MEATY", price:135, img:"https://tiffyai-usd.github.io/Papa_Rons_Cafe/pizza.jpg", desc:"Creamy chicken, bacon, mushrooms, cheese" }
    ]
  },
  {
    title: "GRILL",
    items: [
      { name:"RUMP STEAK", price:160, img:"https://tiffyai-usd.github.io/Papa_Rons_Cafe/rump.jpeg", desc:"Loaded with mushroom sauce & chips" }
    ]
  }
];

function createMenuCard(item){
  const d=document.createElement('div');
  d.className='menu-item';
  d.innerHTML=`
    <img src="${item.img}">
    <div class="card">
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      <div class="price">${item.price?`R${item.price}`:''}</div>
    </div>`;
  return d;
}

function renderMenu(){
  const root=document.getElementById('menuSections');
  root.innerHTML='';
  menuSections.forEach(sec=>{
    const h2=document.createElement('h2');
    h2.className='section-title';
    h2.textContent=sec.title;

    const grid=document.createElement('div');
    grid.className='menu-grid';
    sec.items.forEach(i=>grid.appendChild(createMenuCard(i)));

    root.appendChild(h2);
    root.appendChild(grid);
  });
}
renderMenu();
</script>
<div id="editor">
<h2>MENU EDITOR</h2>

<div id="editorSections"></div>

<button class="add-btn" onclick="addSection()">+ ADD NEW SECTION</button>
</div>

<script>
function renderEditor(){
  const root=document.getElementById('editorSections');
  root.innerHTML='';
  menuSections.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='editor-section';
    div.innerHTML=`
      <div class="section-header">
        <input value="${s.title}" oninput="menuSections[${i}].title=this.value;renderMenu()">
        <button class="remove-btn" onclick="menuSections.splice(${i},1);renderEditor();renderMenu()">✕</button>
      </div>`;
    root.appendChild(div);
  });
}
function addSection(){
  menuSections.push({title:"NEW SECTION",items:[]});
  renderEditor();renderMenu();
}
renderEditor();
</script>

</body>
</html>
