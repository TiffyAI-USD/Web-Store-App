<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webstore Pro - Sovereign Local Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="TiffyAI Web-Store Builder">
    <meta property="og:description" content="A high-performance, mobile-first business in a box, a Web-Store with a built in Point of sale and Instant cash payments even on WhatsApp. Comes with your owner dashboard and sovereign bank account to handle your business and send and receive payments anywhere in the world">
    <meta property="og:type" content="website">
    <style>
        *{box-sizing:border-box;margin:0;padding:0} 
        body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6} 
        :root{--gold:#d4a373;--gold2:#f1b86b;--whatsapp:#25D366} 
        #autoSaveStatus { position: fixed; top: 10px; left: 10px; z-index: 5000; font-size: 0.7rem; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); display: none; } 
        header{ min-height:80vh; background-size:cover; background-position:center; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; width: 100%; margin: 0; } 
        header::after{ content:''; position:absolute; inset:0; background:rgba(0,0,0,0.6); } 
        header *{position:relative;z-index:2} 
        .logo{ max-width:180px; border-radius:16px; border:3px solid var(--gold); margin-bottom:1rem; } 
        h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)} 
        .tagline{font-family:'Bebas Neue';color:var(--gold)} 
        .cta-container { margin-top: 25px; z-index: 10; } 
        .btn-cta { display: inline-block; background: linear-gradient(180deg, var(--gold), var(--gold2)); color: #000; padding: 12px 28px; border-radius: 50px; font-family: 'Bebas Neue'; text-decoration: none; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(212, 163, 115, 0.4); } 
        #menu{max-width:1200px;margin:auto;padding:4rem 5%} 
        .section-title{ font-family:'Bebas Neue'; font-size:2.4rem; color:var(--gold); margin:2rem 0 1rem; } 
        .menu-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.2rem; } 
        .menu-item{ background:#0f0f0f; border-radius:12px; border:1px solid #222; overflow:hidden; position: relative; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); } 
        .marketing-active .menu-item { border: 1px solid var(--gold); transform: scale(1.02); box-shadow: 0 0 15px rgba(212, 163, 115, 0.2); } 
        .badge { position: absolute; top: 15px; left: 15px; padding: 5px 12px; border-radius: 4px; font-family: 'Bebas Neue'; font-size: 0.9rem; z-index: 4; text-transform: uppercase; letter-spacing: 1px; } 
        .badge-scarcity { background: #ff0000; color: #fff; animation: pulse-red 1.5s infinite; } 
        .badge-hot { background: var(--gold); color: #000; } 
        .badge-new { background: #3498db; color: #fff; } 
        @keyframes pulse-red { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } } 
        .share-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: var(--gold); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); z-index: 5; } 
        .status-saver-btn { position: absolute; top: 10px; left: 60px; background: #25D366; color: #fff; border: none; padding: 6px 10px; border-radius: 20px; font-size: 0.7rem; font-family: 'Bebas Neue'; cursor: pointer; z-index: 5; } 
        .rating-stars { color: #ffcc00; margin-bottom: 5px; font-size: 0.9rem; } 
        .menu-item img{ width:100%; height:200px; object-fit:cover; border-bottom:3px solid var(--gold); } 
        .card{padding:1rem} .menu-item h3{font-family:'Bebas Neue';color:var(--gold)} .price{font-family:'Bebas Neue';color:var(--gold2)} 
        .sales-log { background: #000; padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto; margin: 10px 0; border: 1px solid #333; } 
        .log-entry { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; font-size: 0.8rem; } 
        .bulk-panel { background: rgba(37, 211, 102, 0.1); border: 1px solid var(--whatsapp); padding: 15px; border-radius: 12px; margin-top: 20px; } 
        .receipt-wrap { background: #fff; color: #000; padding: 20px; width: 300px; margin: auto; display: none; font-family: 'Courier New', monospace; font-size: 0.85rem; } 
        footer{ background:#000; padding:2rem; text-align:center; border-top:1px solid #222; color:#999; } 
        #editor { position: relative; border-top: 3px dashed var(--gold); padding: 3rem 5%; background-color: #0a0a0a; background-attachment: fixed; } 
        #editor::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 10, 0.8); z-index: 1; } 
        .editor-block { position: relative; z-index: 2; background: rgba(20, 20, 20, 0.9); padding: 1.5rem; border-radius: 14px; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.6); } 
        #editor h2 { position: relative; z-index: 2; } 
        label{display:block;margin-top:1rem;color:var(--gold)} 
        input,textarea,select{ width:100%; padding:10px; background:#222; border:1px solid #444; color:#fff; border-radius:6px; } 
        textarea{resize:vertical} 
        button{ background:linear-gradient(180deg,var(--gold),var(--gold2)); border:none; padding:10px 18px; border-radius:30px; font-family:'Bebas Neue'; font-size:1.1rem; cursor:pointer; margin-top:10px; position: relative; z-index: 2; } 
        .remove{background:#900;color:#fff} .cloud-btn { background: #3498db; color: white; margin-bottom: 5px; font-size: 0.8rem; } 
        #whatsappOrderBtn{ position:fixed; bottom:20px; right:20px; z-index:999; background:linear-gradient(180deg,#25D366,#1ebe5d); color:#071010; padding:14px 22px; border-radius:40px; font-family:'Bebas Neue'; font-size:1.2rem; text-decoration:none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); } 
        .quote-btn { position: fixed; bottom: 80px; right: 20px; z-index: 998; background: #fff; color: #000; padding: 10px 20px; border-radius: 30px; font-family: 'Bebas Neue'; cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); } 
        .modal{ position:fixed; inset:0; background:rgba(0,0,0,0.75); display:flex; align-items:center; justify-content:center; z-index:2000; } 
        .hidden{display:none} 
        .modal-glass{ width:90%; max-width:420px; background:rgba(20,20,20,0.85); backdrop-filter:blur(14px); border:1px solid rgba(212,163,115,0.4); border-radius:20px; padding:2rem; color:#fff; } 
        .support-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; z-index: 3000; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); } 
    </style>
</head>
<body>
    <div id="autoSaveStatus">Draft Saved Locally</div>
    <header id="header">
        <img id="logo" class="logo">
        <h1 id="cafeName">YOUR WEB STORE</h1>
        <p id="tagline" class="tagline">Local Performance Mode</p>
        <div class="cta-container"> <a href="#" id="ctaBtn" class="btn-cta" style="display:none;">ORDER NOW</a> </div>
    </header>
    <section id="menu"><div id="menuRender"></div></section>
    <footer id="footer"><p id="footerText">© 2026 YOUR BUSINESS</p></footer>
    
    <div id="editor">
        <h2 style="font-family:'Bebas Neue';color:var(--gold)">BUSINESS INFO</h2>
        <div class="editor-block">
            <label>Business Name</label>
            <input id="editName" oninput="document.getElementById('cafeName').textContent=this.value; saveDraft()">
            <label>Tagline</label>
            <input id="editTag" oninput="document.getElementById('tagline').textContent=this.value; saveDraft()">
            <label>Logo (URL or Upload)</label>
            <button class="cloud-btn" onclick="this.nextElementSibling.nextElementSibling.click()">☁️ UPLOAD LOGO</button>
            <input id="logoURL" oninput="document.getElementById('logo').src=this.value; saveDraft()">
            <input type="file" style="display:none" onchange="uploadImage(this, img=>{document.getElementById('logo').src=img; document.getElementById('logoURL').value=img; saveDraft();})">
            <label>Banner (URL or Upload)</label>
            <button class="cloud-btn" onclick="this.nextElementSibling.nextElementSibling.click()">☁️ UPLOAD BANNER</button>
            <input id="bannerURL" oninput="document.getElementById('header').style.backgroundImage='url('+this.value+')'; saveDraft()">
            <input type="file" style="display:none" onchange="uploadImage(this, img=>{document.getElementById('header').style.backgroundImage='url('+img+')'; document.getElementById('bannerURL').value=img; saveDraft();})">
            <button onclick="downloadHTML()" style="width:100%;">DOWNLOAD LOCAL SITE</button>
        </div>
        <div id="menuEditor"></div>
        <button onclick="addSection()">+ ADD SECTION</button>
    </div>

    <div id="receiptArea" class="receipt-wrap"></div>
    <canvas id="statusCanvas" width="1080" height="1920" style="display:none;"></canvas>
    <iframe id="printFrame" style="display:none;"></iframe>

    <script>
        /* LOCAL SOVEREIGN ENGINE */
        let menuSections = JSON.parse(localStorage.getItem('tiffyai_data'))?.menu || [{ title: "Products", items: [] }];
        let whatsappNumber = localStorage.getItem('tiffyai_wa') || "+27660000000";
        let activeCurrency = localStorage.getItem('tiffyai_currency') || 'ZAR';
        let orderState = {};

        function saveDraft() {
            const storeData = {
                name: document.getElementById('cafeName').textContent,
                tag: document.getElementById('tagline').textContent,
                logo: document.getElementById('logoURL').value,
                banner: document.getElementById('bannerURL').value,
                wa: whatsappNumber,
                curr: activeCurrency,
                menu: menuSections,
                ts: new Date().getTime()
            };
            localStorage.setItem('tiffyai_data', JSON.stringify(storeData));
            const indicator = document.getElementById('autoSaveStatus');
            indicator.style.display = 'block';
            setTimeout(() => indicator.style.display = 'none', 2000);
        }

        function uploadImage(input, cb){
            const f = input.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = e => cb(e.target.result);
            r.readAsDataURL(f);
        }

        function downloadHTML() {
            const doc = document.documentElement.cloneNode(true);
            ['#editor', '#autoSaveStatus', '.support-btn'].forEach(id => doc.querySelector(id)?.remove());
            const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'WebStore_Local.html';
            a.click();
        }

        // Logic placeholder: Paste all your specific POS, renderMenu, and startBulk 
        // functions here. They will now run against the LocalStorage state above.

        document.addEventListener('DOMContentLoaded', () => {
            const saved = JSON.parse(localStorage.getItem('tiffyai_data'));
            if(saved) {
                document.getElementById('cafeName').textContent = saved.name;
                document.getElementById('tagline').textContent = saved.tag;
                document.getElementById('logo').src = saved.logo;
                document.getElementById('header').style.backgroundImage = `url(${saved.banner})`;
                menuSections = saved.menu;
            }
        });
    </script>
</body>
</html>
