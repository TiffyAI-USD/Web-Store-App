<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webstore Pro - Local Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
:root{--gold:#d4a373;--gold2:#f1b86b;--whatsapp:#25D366}

#autoSaveStatus {
  position: fixed; top: 10px; left: 10px; z-index: 5000; font-size: 0.7rem;
  background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--gold); color: var(--gold); display: none;
}

#controlPanel {
  background:#1a1a1a; padding:20px; margin:15px; border:2px solid var(--gold);
  border-radius:12px; text-align:center;
}

header{min-height:80vh;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;}
header::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.6);}
header *{position:relative;z-index:2}
.logo{max-width:180px;border-radius:16px;border:3px solid var(--gold);margin-bottom:1rem;}
h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
.tagline{font-family:'Bebas Neue';color:var(--gold)}

.cta-container { margin-top: 25px; z-index: 10; }
.btn-cta { display:inline-block; background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#000; padding:12px 28px; border-radius:50px; font-family:'Bebas Neue'; text-decoration:none; font-size:1.2rem; box-shadow:0 4px 15px rgba(212,163,115,0.4); }

#menu{max-width:1200px;margin:auto;padding:4rem 5%}
.section-title{font-family:'Bebas Neue';font-size:2.4rem;color:var(--gold);margin:2rem 0 1rem;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;}
.menu-item{background:#0f0f0f;border-radius:12px;border:1px solid #222;overflow:hidden;position:relative;}
.menu-item img{width:100%;height:200px;object-fit:cover;border-bottom:3px solid var(--gold);}
.card{padding:1rem;}
.menu-item h3{font-family:'Bebas Neue';color:var(--gold)}
.price{font-family:'Bebas Neue';color:var(--gold2)}

#editor{position:relative;border-top:3px dashed var(--gold);padding:3rem 5%;background:#0a0a0a;}
.editor-block{background:rgba(20,20,20,0.9);padding:1.5rem;border-radius:14px;margin-bottom:2rem;box-shadow:0 10px 30px rgba(0,0,0,0.6);}

label{display:block;margin-top:1rem;color:var(--gold)}
input,textarea,select{width:100%;padding:10px;background:#222;border:1px solid #444;color:#fff;border-radius:6px;}
button{background:linear-gradient(180deg,var(--gold),var(--gold2));border:none;padding:10px 18px;border-radius:30px;font-family:'Bebas Neue';font-size:1.1rem;cursor:pointer;margin:5px;}
.remove{background:#900;color:#fff}

#whatsappOrderBtn{position:fixed;bottom:20px;right:20px;z-index:999;background:linear-gradient(180deg,#25D366,#1ebe5d);color:#071010;padding:14px 22px;border-radius:40px;font-family:'Bebas Neue';font-size:1.2rem;text-decoration:none;box-shadow:0 5px 15px rgba(0,0,0,0.3);}
</style>
</head>

<body>
<div id="autoSaveStatus">Saved Draft</div>

<!-- CONTROL PANEL -->
<div id="controlPanel" class="editor-block">
    <h1>Control Panel</h1>
    <button onclick="addSection()">+ Add Section</button>
    <button onclick="triggerPaymentFlow()">Show Payment</button>
    <button onclick="saveDraft()">💾 Save Draft</button>
    <button onclick="downloadHTML()">📥 Download HTML</button>
</div>

<div id="paymentModal" class="modal hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:2000;">
  <div style="background:#222;padding:30px;border-radius:12px;max-width:400px;text-align:center;border:2px solid var(--gold);">
    <h2 style="color:var(--gold)">Payment Required</h2>
    <p>$70 USD</p>
    <button onclick="payWithPaypal()" style="width:100%;margin:10px 0;padding:12px;">Pay with PayPal</button>
    <button onclick="confirmManualPayment()" style="width:100%;margin:10px 0;padding:12px;">I will send EFT</button>
    <button onclick="closePayment()" style="background:none;color:#aaa;">Cancel</button>
  </div>
</div>

<header id="header">
  <img id="logo" class="logo" src="">
  <h1 id="cafeName">YOUR WEB STORE BUSINESS</h1>
  <p id="tagline" class="tagline">With Live Preview</p>
  <div class="cta-container">
      <a href="#" id="ctaBtn" class="btn-cta" style="display:none;">ORDER NOW</a>
  </div>
</header>

<section id="menu"><div id="menuRender"></div></section>

<footer><p id="footerText">© 2026 YOUR BUSINESS</p></footer>

<div id="editor">
<h2 style="font-family:'Bebas Neue';color:var(--gold)">BUSINESS INFO</h2>
<div class="editor-block">
  <label>Business Name</label>
  <input id="editName" oninput="document.getElementById('cafeName').textContent=this.value;saveDraft()">

  <label>Tagline</label>
  <input id="editTag" oninput="document.getElementById('tagline').textContent=this.value;saveDraft()">

  <label>Logo (URL or Upload)</label>
  <button onclick="this.nextElementSibling.click()">☁️ Upload Logo</button>
  <input type="file" style="display:none" onchange="uploadImage(this, img => {document.getElementById('logo').src = img; document.getElementById('logoURL').value = img; saveDraft();})">
  <input id="logoURL" placeholder="Or paste image URL" oninput="document.getElementById('logo').src=this.value;saveDraft()">

  <label>Banner (URL or Upload)</label>
  <button onclick="this.nextElementSibling.click()">☁️ Upload Banner</button>
  <input type="file" style="display:none" onchange="uploadImage(this, img => {document.getElementById('header').style.backgroundImage = 'url(' + img + ')'; document.getElementById('bannerURL').value = img; saveDraft();})">
  <input id="bannerURL" placeholder="Or paste banner URL" oninput="document.getElementById('header').style.backgroundImage='url('+this.value+')';saveDraft()">
</div>

<h2 style="font-family:'Bebas Neue';color:var(--gold)">MENU BUILDER</h2>
<div id="menuEditor"></div>
<button onclick="addSection()">+ ADD SECTION</button>
<button onclick="downloadHTML()">📥 DOWNLOAD FULL WEBSITE</button>
<button onclick="saveDraft()" style="background:#3498db;">💾 SAVE TO LOCAL STORAGE</button>
</div>

<canvas id="statusCanvas" width="1080" height="1920" style="display:none;"></canvas>

<script>
let whatsappNumber = "+27660000000";
let activeCurrency = "ZAR";
let menuSections = [{ title: "Products", items: [{ name: 'Sample Item', price: 100, desc: "Description here", img: "", rating: 5, badge: 'none' }] }];
const orderState = {};

/* ================== LOCAL STORAGE ================== */
function saveDraft() {
  const data = {
    cafeName: document.getElementById('cafeName').textContent,
    tagline: document.getElementById('tagline').textContent,
    footer: document.getElementById('footerText').textContent,
    logo: document.getElementById('logoURL').value,
    banner: document.getElementById('bannerURL').value,
    wa: whatsappNumber,
    menu: menuSections
  };
  localStorage.setItem('webstore_pro_draft', JSON.stringify(data));

  const status = document.getElementById('autoSaveStatus');
  status.style.display = 'block';
  status.textContent = '✅ Saved';
  setTimeout(() => status.style.display = 'none', 1200);
}

function loadDraft() {
  const saved = localStorage.getItem('webstore_pro_draft');
  if (!saved) return;
  const d = JSON.parse(saved);

  menuSections = d.menu || menuSections;
  document.getElementById('cafeName').textContent = d.cafeName || "YOUR WEB STORE BUSINESS";
  document.getElementById('tagline').textContent = d.tagline || "With Live Preview";
  document.getElementById('footerText').textContent = d.footer || "© 2026 YOUR BUSINESS";

  if (d.logo) {
    document.getElementById('logo').src = d.logo;
    document.getElementById('logoURL').value = d.logo;
  }
  if (d.banner) {
    document.getElementById('header').style.backgroundImage = `url(${d.banner})`;
    document.getElementById('bannerURL').value = d.banner;
  }
}

/* ================== UPLOAD & CORE ================== */
function uploadImage(input, callback) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => callback(e.target.result);
  reader.readAsDataURL(file);
}

function addSection() {
  menuSections.push({ title: "New Section", items: [] });
  renderEditor();
  renderMenu();
  saveDraft();
}

function triggerPaymentFlow() {
  document.getElementById('paymentModal').style.display = 'flex';
}

function closePayment() {
  document.getElementById('paymentModal').style.display = 'none';
}

function downloadHTML() {
  const doc = document.documentElement.cloneNode(true);
  ['#editor', '#controlPanel', '#paymentModal'].forEach(sel => {
    const el = doc.querySelector(sel);
    if (el) el.remove();
  });

  const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MyWebStore.html';
  a.click();
}

/* ================== RENDERING ================== */
function renderMenu() {
  const container = document.getElementById('menuRender');
  container.innerHTML = '';

  menuSections.forEach((sec, s) => {
    const h2 = document.createElement('h2');
    h2.className = 'section-title';
    h2.textContent = sec.title;
    container.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'menu-grid';

    sec.items.forEach((it, i) => {
      const card = document.createElement('div');
      card.className = 'menu-item';
      card.innerHTML = `
        <img src="${it.img || 'https://via.placeholder.com/300?text=No+Image'}">
        <div class="card">
          <h3>${it.name}</h3>
          <p>${it.desc}</p>
          <div class="price">R${it.price}</div>
        </div>`;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
}

function renderEditor() {
  const container = document.getElementById('menuEditor');
  container.innerHTML = '';

  menuSections.forEach((sec, s) => {
    const block = document.createElement('div');
    block.className = 'editor-block';
    block.innerHTML = `
      <input value="\( {sec.title}" oninput="menuSections[ \){s}].title=this.value; renderMenu(); saveDraft()" style="font-size:1.2rem;">
      <button class="remove" onclick="menuSections.splice(${s},1); renderEditor(); renderMenu(); saveDraft()">Remove Section</button>

      ${sec.items.map((item, i) => `
        <div style="margin:15px 0; padding:15px; border-top:1px solid #444;">
          <input value="\( {item.name}" oninput="menuSections[ \){s}].items[${i}].name=this.value; renderMenu(); saveDraft()" placeholder="Item Name">
          <input type="number" value="\( {item.price}" oninput="menuSections[ \){s}].items[${i}].price=this.value; renderMenu(); saveDraft()" placeholder="Price">
          <textarea oninput="menuSections[\( {s}].items[ \){i}].desc=this.value; renderMenu(); saveDraft()" placeholder="Description">${item.desc}</textarea>
          <input value="\( {item.img||''}" oninput="menuSections[ \){s}].items[${i}].img=this.value; renderMenu(); saveDraft()" placeholder="Image URL">
          <button onclick="menuSections[\( {s}].items.splice( \){i},1); renderEditor(); renderMenu(); saveDraft()" class="remove">Remove Item</button>
        </div>
      `).join('')}

      <button onclick="menuSections[${s}].items.push({name:'New Item', price:0, desc:'', img:''}); renderEditor(); renderMenu(); saveDraft()">+ Add Item</button>
    `;
    container.appendChild(block);
  });
}

function payWithPaypal(){ window.open('https://paypal.me/CatHostProWebsites/70','_blank'); }
function confirmManualPayment(){ alert("Manual payment ready"); closePayment(); }

/* INIT */
document.addEventListener('DOMContentLoaded', () => {
  loadDraft();
  renderMenu();
  renderEditor();
});
</script>
</body>
</html>
