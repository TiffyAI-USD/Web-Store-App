<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webstore Pro - Local Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* BASE STYLES */
        *{box-sizing:border-box;margin:0;padding:0} 
        body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6;overflow-x:hidden} 
        :root{--gold:#d4a373;--gold2:#f1b86b;--whatsapp:#25D366}

        /* HEADER FIX: Ensures Banner matches content width exactly */
        header{ 
            min-height:80vh; 
            background-size:cover; 
            background-position:center; 
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            justify-content:center; 
            text-align:center; 
            position:relative;
            width: 100%;
        }
        header::after{ content:''; position:absolute; inset:0; background:rgba(0,0,0,0.6); } 
        header *{position:relative;z-index:2} 
        .logo{ max-width:180px; border-radius:16px; border:3px solid var(--gold); margin-bottom:1rem; } 
        h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)} 
        .tagline{font-family:'Bebas Neue';color:var(--gold)} 

        /* MENU GRID - Maintains original layout */
        #menu{max-width:1200px;margin:0 auto;padding:4rem 5%} 
        .menu-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.2rem; } 
        .menu-item{ background:#0f0f0f; border-radius:12px; border:1px solid #222; overflow:hidden; position: relative; } 
        .menu-item img{ width:100%; height:200px; object-fit:cover; border-bottom:3px solid var(--gold); } 
        
        /* REST OF YOUR ORIGINAL STYLES */
        .card{padding:1rem}
        .editor-block { background: rgba(20, 20, 20, 0.9); padding: 1.5rem; border-radius: 14px; margin-bottom: 2rem; }
        #editor { padding: 3rem 5%; background-color: #0a0a0a; border-top: 3px solid var(--gold); }
        button { background: linear-gradient(180deg, var(--gold), var(--gold2)); border:none; padding:10px 18px; border-radius:30px; font-family:'Bebas Neue'; cursor:pointer; }
    </style>
</head>
<body>
    <script>
        /* LOCAL STATE MANAGEMENT */
        let menuSections = JSON.parse(localStorage.getItem('tiffyai_data')) || [{ title: "Products", items: [] }];
        let whatsappNumber = localStorage.getItem('tiffyai_wa') || "+27660000000";

        /* REMOVED: All RENDER_API and Cloud Sync functions */
        
        function saveDraft() {
            const storeData = {
                businessName: document.getElementById('cafeName').textContent,
                tagline: document.getElementById('tagline').textContent,
                menu: menuSections,
                wa: whatsappNumber,
                ts: new Date().getTime()
            };
            localStorage.setItem('tiffyai_data', JSON.stringify(storeData));
        }

        function downloadHTML() {
            // Generates file locally without external dependencies
            const doc = document.documentElement.cloneNode(true);
            const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'WebStore_Local.html';
            a.click();
        }

        /* All your other original functions (renderMenu, renderEditor, etc.) stay here */
        /* They now read/write directly to localStorage instead of reaching out to Render */

    </script>
</body>
</html>
