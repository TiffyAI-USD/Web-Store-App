<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webstore Pro - Cloud Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
    :root{--gold:#d4a373;--gold2:#f1b86b;--whatsapp:#25D366}

    #autoSaveStatus {position:fixed;top:10px;left:10px;z-index:5000;font-size:0.7rem;background:rgba(0,0,0,0.7);padding:4px 10px;border-radius:20px;border:1px solid var(--gold);color:var(--gold);display:none;}
    header{min-height:80vh;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;}
    header::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.6);}
    header *{position:relative;z-index:2}
    .logo{max-width:180px;border-radius:16px;border:3px solid var(--gold);margin-bottom:1rem;}
    h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
    .tagline{font-family:'Bebas Neue';color:var(--gold)}
    .cta-container {margin-top:25px;z-index:10;}
    .btn-cta {display:inline-block;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#000;padding:12px 28px;border-radius:50px;font-family:'Bebas Neue';text-decoration:none;font-size:1.2rem;box-shadow:0 4px 15px rgba(212,163,115,0.4);}
    #menu{max-width:1200px;margin:auto;padding:4rem 5%}
    .menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;}
    .menu-item{background:#0f0f0f;border-radius:12px;border:1px solid #222;overflow:hidden;position:relative;}
    .menu-item img{width:100%;height:200px;object-fit:cover;border-bottom:3px solid var(--gold);}
    .card{padding:1rem;}
    .price{font-family:'Bebas Neue';color:var(--gold2)}
    #editor{position:relative;border-top:3px dashed var(--gold);padding:3rem 5%;background:#0a0a0a;}
    .editor-block{background:rgba(20,20,20,0.9);padding:1.5rem;border-radius:14px;margin-bottom:2rem;}
    input,textarea{width:100%;padding:10px;background:#222;border:1px solid #444;color:#fff;margin:5px 0;}
    button{background:linear-gradient(180deg,var(--gold),var(--gold2));border:none;padding:10px 18px;border-radius:30px;font-family:'Bebas Neue';cursor:pointer;}
</style>
</head>
<body>
<div id="autoSaveStatus">Saved Draft</div>

<header id="header">
  <img id="logo" class="logo">
  <h1 id="cafeName">YOUR WEB STORE</h1>
  <p id="tagline" class="tagline">...</p>
  <div class="cta-container">
      <a href="#" id="ctaBtn" class="btn-cta" style="display:none;">ORDER NOW</a>
  </div>
</header>

<section id="menu"><div id="menuRender"></div></section>

<div id="editor">
    <div class="editor-block">
      <label>CTA Text</label>
      <input id="ctaText" oninput="updateCTA();saveDraft()">
      <label>CTA URL</label>
      <input id="ctaUrl" oninput="updateCTA();saveDraft()">
    </div>
    <div id="menuEditor"></div>
</div>

<div id="paymentModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:2000;">
    <div style="background:#222;padding:20px;border-radius:12px;">
        <img id="qrDisplay" style="width:200px; height:200px; display:block;">
        <button onclick="document.getElementById('paymentModal').style.display='none'">Close</button>
    </div>
</div>

<script>
let menuSections = [{ title: "Products", items: [{ name: 'Item', price: 100, desc: "Desc", img: "" }] }];

function updateCTA() {
    const btn = document.getElementById('ctaBtn');
    btn.textContent = document.getElementById('ctaText').value.toUpperCase();
    btn.href = document.getElementById('ctaUrl').value;
    btn.style.display = document.getElementById('ctaText').value ? "inline-block" : "none";
}

function saveDraft() {
  const data = {
    name: document.getElementById('cafeName').textContent,
    ctaText: document.getElementById('ctaText').value,
    ctaUrl: document.getElementById('ctaUrl').value,
    menu: menuSections,
    qr: document.getElementById('qrDisplay').src
  };
  localStorage.setItem('webstore_pro_draft', JSON.stringify(data));
}

function loadDraft() {
  const saved = localStorage.getItem('webstore_pro_draft');
  if (!saved) return;
  const d = JSON.parse(saved);
  menuSections = d.menu;
  document.getElementById('ctaText').value = d.ctaText || "";
  document.getElementById('ctaUrl').value = d.ctaUrl || "";
  if(d.qr) document.getElementById('qrDisplay').src = d.qr;
  updateCTA(); renderMenu(); renderEditor();
}

function uploadImage(input, cb) {
  const reader = new FileReader();
  reader.onload = e => cb(e.target.result);
  reader.readAsDataURL(input.files[0]);
}

function renderMenu() {
  const container = document.getElementById('menuRender');
  container.innerHTML = '';
  menuSections.forEach(sec => {
    container.innerHTML += `<h2>${sec.title}</h2>`;
    sec.items.forEach(it => {
      container.innerHTML += `<div class="menu-item"><img src="${it.img}"><div class="card"><h3>${it.name}</h3><div class="price">R${it.price}</div></div></div>`;
    });
  });
}

function renderEditor() {
  const me = document.getElementById('menuEditor');
  me.innerHTML = '';
  menuSections.forEach((sec, s) => {
    sec.items.forEach((it, i) => {
      me.innerHTML += `
        <div class="editor-block">
          <input value="${it.name}" oninput="menuSections[${s}].items[${i}].name=this.value;renderMenu()">
          <input type="number" value="${it.price}" oninput="menuSections[${s}].items[${i}].price=this.value;renderMenu()">
          <input type="file" onchange="uploadImage(this, img=>{menuSections[${s}].items[${i}].img=img; renderMenu(); saveDraft()})">
        </div>`;
    });
  });
}

document.addEventListener('DOMContentLoaded', loadDraft);
</script>
</body>
</html>
