<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>Webstore Pro - Local Edition</title> <meta name="viewport" content="width=device-width, initial-scale=1"> <style> *{box-sizing:border-box;margin:0;padding:0} body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6} :root{--gold:#d4a373;--gold2:#f1b86b;--whatsapp:#25D366} #autoSaveStatus { position: fixed; top: 10px; left: 10px; z-index: 5000; font-size: 0.7rem; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); display: none; } header{ min-height:80vh; background-size:cover; background-position:center; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; width: 100vw; } header::after{ content:''; position:absolute; inset:0; background:rgba(0,0,0,0.6); } header *{position:relative;z-index:2} .logo{ max-width:180px; border-radius:16px; border:3px solid var(--gold); margin-bottom:1rem; } h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)} .tagline{font-family:'Bebas Neue';color:var(--gold)} .cta-container { margin-top: 25px; z-index: 10; } .btn-cta { display: inline-block; background: linear-gradient(180deg, var(--gold), var(--gold2)); color: #000; padding: 12px 28px; border-radius: 50px; font-family: 'Bebas Neue'; text-decoration: none; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(212, 163, 115, 0.4); } #menu{max-width:1200px;margin:auto;padding:4rem 5%} .section-title{ font-family:'Bebas Neue'; font-size:2.4rem; color:var(--gold); margin:2rem 0 1rem; } .menu-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.2rem; } .menu-item{ background:#0f0f0f; border-radius:12px; border:1px solid #222; overflow:hidden; position: relative; } .menu-item img{ width:100%; height:200px; object-fit:cover; border-bottom:3px solid var(--gold); } .editor-block { background: rgba(20, 20, 20, 0.9); padding: 1.5rem; border-radius: 14px; margin-bottom: 2rem; } #editor { position: relative; border-top: 3px dashed var(--gold); padding: 3rem 5%; background-color: #0a0a0a; } label{display:block;margin-top:1rem;color:var(--gold)} input,textarea,select{ width:100%; padding:10px; background:#222; border:1px solid #444; color:#fff; border-radius:6px; } button{ background:linear-gradient(180deg,var(--gold),var(--gold2)); border:none; padding:10px 18px; border-radius:30px; font-family:'Bebas Neue'; font-size:1.1rem; cursor:pointer; margin-top:10px; } </style> </head> <body> <div id="autoSaveStatus">Saved Locally</div> <header id="header"> <img id="logo" class="logo"> <h1 id="cafeName">YOUR WEB STORE BUSINESS</h1> <p id="tagline" class="tagline">Local Preview</p> <div class="cta-container"> <a href="#" id="ctaBtn" class="btn-cta" style="display:none;">ORDER NOW</a> </div> </header> <section id="menu"> <div id="menuRender"></div> </section> <div id="editor"> <h2>BUSINESS INFO</h2> <div class="editor-block"> <label>Business Name</label> <input id="editName" oninput="document.getElementById('cafeName').textContent=this.value; saveDraft()"> <label>Logo (URL)</label> <input id="logoURL" oninput="document.getElementById('logo').src=this.value; saveDraft()"> <label>Banner (URL)</label> <input id="bannerURL" oninput="document.getElementById('header').style.backgroundImage='url('+this.value+')'; saveDraft()"> <button onclick="downloadHTML()">DOWNLOAD LOCAL HTML</button> </div> <div id="menuEditor"></div> <button onclick="addSection()">+ ADD SECTION</button> </div> <script> let menuSections = JSON.parse(localStorage.getItem('local_store_data')) || [{ title: "Products", items: [] }]; function saveDraft() { const storeData = { name: document.getElementById('cafeName').textContent, tag: document.getElementById('tagline').textContent, logo: document.getElementById('logoURL').value, banner: document.getElementById('bannerURL').value, menu: menuSections }; localStorage.setItem('local_store_data', JSON.stringify(storeData)); } function downloadHTML() { const doc = document.documentElement.cloneNode(true); ['#editor', '#autoSaveStatus'].forEach(id => doc.querySelector(id)?.remove()); const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'WebStore_Local.html'; a.click(); } function render() { document.getElementById('menuRender').innerHTML = ''; menuSections.forEach((sec, s) => { const grid = document.createElement('div'); grid.className = 'menu-grid'; sec.items.forEach(it => { grid.innerHTML += `<div class="menu-item"><img src="${it.img}"><div style="padding:10px"><h3>${it.name}</h3></div></div>`; }); document.getElementById('menuRender').appendChild(grid); }); } document.addEventListener('DOMContentLoaded', () => { const saved = JSON.parse(localStorage.getItem('local_store_data')); if (saved) { document.getElementById('cafeName').textContent = saved.name; document.getElementById('logo').src = saved.logo; document.getElementById('header').style.backgroundImage = `url(${saved.banner})`; menuSections = saved.menu; render(); } }); </script> </body> </html>
