<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebStore Local</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; }
        .editor-block { background: #1a1a1a; padding: 20px; margin-bottom: 20px; border: 1px solid #d4a373; }
        button { padding: 10px 20px; cursor: pointer; background: #d4a373; border: none; margin: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="editor-block">
        <h1>Control Panel</h1>
        <button onclick="addSection()">+ Add Section</button>
        <button onclick="triggerPaymentFlow()">Show Payment</button>
    </div>

    <div id="menuEditor"></div>

    <div id="paymentModal" class="hidden" style="position:fixed; top:20%; left:20%; background:#333; padding:20px;">
        <h2>Payment Required</h2>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        let menuSections = [{ title: "My Products", items: [] }];

        function addSection() {
            menuSections.push({ title: "New Section", items: [] });
            renderEditor();
        }

        function triggerPaymentFlow() {
            document.getElementById('paymentModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('paymentModal').classList.add('hidden');
        }

        function renderEditor() {
            const container = document.getElementById('menuEditor');
            container.innerHTML = '';
            menuSections.forEach((sec, s) => {
                const div = document.createElement('div');
                div.innerHTML = `<h3>${sec.title}</h3>`;
                container.appendChild(div);
            });
            console.log("Rendered");
        }

        renderEditor();
    </script>
</body>
</html>
