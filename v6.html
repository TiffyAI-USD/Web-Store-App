<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiffyAI Sovereign Gateway - V6 Ecosystem</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .status-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 10px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .section {
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .section h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .ledger-view {
            margin-top: 16px;
            font-size: 0.85rem;
        }

        .ledger-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }

        .meta-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-all;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TiffyAI Sovereign Gateway</h1>
            <p>V6 Cross-Browser IP-Routed Ledger System</p>
            <div id="connectionStatus" class="status-badge">Node Active & Synchronized</div>
        </header>

        <!-- Store Profile Section -->
        <div class="section">
            <h2>Active Store Context</h2>
            <div class="form-group">
                <label>Store Identifier Key</label>
                <input type="text" id="storeKeyInput" value="store_ledger_main_oasis">
            </div>
            <div class="form-group">
                <label>Creator IP Node</label>
                <input type="text" id="creatorIpInput" placeholder="Fetching IP...">
            </div>
            <button onclick="saveStoreContext()">Commit Store Configuration</button>
        </div>

        <!-- Simulated Payment / Deeplink Generator -->
        <div class="section">
            <h2>Simulate Cross-Browser Payment Trigger</h2>
            <div class="form-group">
                <label>Payment Amount ($)</label>
                <input type="number" id="payAmountInput" value="50.00" step="0.01">
            </div>
            <div class="form-group">
                <label>Buyer Name</label>
                <input type="text" id="buyerNameInput" value="Remote Node Buyer">
            </div>
            <button onclick="triggerCrossBrowserDeeplink()">Generate & Test Deeplink Payload</button>
        </div>

        <!-- Master Ledger Display -->
        <div class="section">
            <h2>Master IP Ledger & Transactions</h2>
            <div id="ledgerContainer" class="ledger-view">
                <p style="color: var(--text-muted);">No transactions recorded yet.</p>
            </div>
        </div>
    </div>

    <script>
        // Global IP Store & Initialization
        let cachedCreatorIP = "127.0.0.1";

        async function initializeGateway() {
            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let data = await res.json();
                if (data && data.ip) {
                    cachedCreatorIP = data.ip;
                }
            } catch(e) {
                console.warn("External IP fetch failed, using fallback network node.");
            }

            document.getElementById('creatorIpInput').value = cachedCreatorIP;

            // Step 1: FORCE ABSORB incoming state if present in URL (Cross-Browser Sandbox Bridge)
            forceAbsorbIncomingPayload();

            // Step 2: Render Ledger state
            renderLedgerState();
        }

        function getLedgerKey() {
            const ipClean = cachedCreatorIP.replace(/[^a-zA-Z0-9]/g, '_');
            return "tiffy_ip_routed_ledger_" + ipClean;
        }

        function forceAbsorbIncomingPayload() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const paidAmount = urlParams.get('tiffy_paid_amount');
                const targetStoreKey = urlParams.get('tiffy_target_store');
                const targetCreatorIP = urlParams.get('tiffy_creator_ip');
                const buyerName = urlParams.get('tiffy_buyer_name');
                const buyerPhone = urlParams.get('tiffy_buyer_phone');

                if (targetCreatorIP) {
                    cachedCreatorIP = targetCreatorIP;
                    document.getElementById('creatorIpInput').value = cachedCreatorIP;
                }

                if (targetStoreKey) {
                    if (targetStoreKey) {
                        document.getElementById('storeKeyInput').value = targetStoreKey;
                    }

                    let ledgerKey = getLedgerKey();
                    let registry = JSON.parse(localStorage.getItem(ledgerKey) || "{}");

                    if (!registry[targetStoreKey]) {
                        registry[targetStoreKey] = {
                            name: targetStoreKey.replace('store_ledger_', '').replace(/_/g, ' '),
                            url: window.location.href.split('?')[0],
                            salesRevenue: 0,
                            transactions: []
                        };
                    }

                    if (paidAmount) {
                        let amt = parseFloat(paidAmount);
                        let resolvedBuyer = buyerName ? decodeURIComponent(buyerName) : "Remote Browser Buyer";
                        let resolvedPhone = buyerPhone ? decodeURIComponent(buyerPhone) : "Verified via IP Route";
                        
                        let txId = "TX-IP-" + Math.floor(Math.random() * 900000 + 100000);
                        let existingTx = registry[targetStoreKey].transactions.find(t => t.amount === amt && t.buyerName === resolvedBuyer);

                        if (!existingTx) {
                            registry[targetStoreKey].salesRevenue += amt;
                            registry[targetStoreKey].transactions.unshift({
                                id: txId,
                                amount: amt,
                                buyerName: resolvedBuyer,
                                buyerPhone: resolvedPhone,
                                time: new Date().toLocaleString()
                            });
                        }
                    }

                    localStorage.setItem(ledgerKey, JSON.stringify(registry));
                    console.log("Forced State Absorption Successful for store:", targetStoreKey);
                }
            } catch(e) {
                console.error("Critical absorption failure:", e);
            }
        }

        function saveStoreContext() {
            let storeKey = document.getElementById('storeKeyInput').value.trim();
            let ledgerKey = getLedgerKey();
            let registry = JSON.parse(localStorage.getItem(ledgerKey) || "{}");

            if (!registry[storeKey]) {
                registry[storeKey] = {
                    name: storeKey,
                    url: window.location.href.split('?')[0],
                    salesRevenue: 0,
                    transactions: []
                };
            }

            localStorage.setItem(ledgerKey, JSON.stringify(registry));
            alert("Store configuration committed to local storage node successfully.");
            renderLedgerState();
        }

        function triggerCrossBrowserDeeplink() {
            let storeKey = document.getElementById('storeKeyInput').value.trim();
            let amount = document.getElementById('payAmountInput').value;
            let buyer = encodeURIComponent(document.getElementById('buyerNameInput').value);
            let currentIp = cachedCreatorIP;

            let selfUrl = window.location.href.split('?')[0];
            let payloadUrl = `${selfUrl}?tiffy_target_store=${encodeURIComponent(storeKey)}&tiffy_creator_ip=${encodeURIComponent(currentIp)}&tiffy_paid_amount=${amount}&tiffy_buyer_name=${buyer}&tiffy_buyer_phone=Verified`;

            // Copy or open deeplink to simulate cross-browser transition
            prompt("Copy this cross-browser deeplink URL and paste it into your other browser (e.g., Chrome/Brave):", payloadUrl);
        }

        function renderLedgerState() {
            let storeKey = document.getElementById('storeKeyInput').value.trim();
            let ledgerKey = getLedgerKey();
            let registry = JSON.parse(localStorage.getItem(ledgerKey) || "{}");
            let container = document.getElementById('ledgerContainer');

            let storeData = registry[storeKey];

            if (!storeData || !storeData.transactions || storeData.transactions.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted);">No transactions found for store key: ${storeKey}</p>`;
                return;
            }

            let html = `<div style="margin-bottom: 10px; font-weight: bold; color: var(--accent);">Total Revenue: $${storeData.salesRevenue.toFixed(2)}</div>`;
            
            storeData.transactions.forEach(tx => {
                html += `
                    <div class="ledger-item">
                        <strong>${tx.id} - $${tx.amount.toFixed(2)}</strong>
                        <div class="meta-info">Buyer: ${tx.buyerName} | ${tx.time}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.onload = initializeGateway;
    </script>
</body>
</html>
