<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Café Webstore</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="Online Café Menu">
<meta property="og:description" content="Order directly via WhatsApp">
<meta property="og:image" id="ogImage" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
:root{--gold:#d4a373;--gold2:#f1b86b}

/* HEADER */
header{
  min-height:80vh;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
header::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}
header *{position:relative;z-index:2}
.logo{
  max-width:180px;
  border-radius:16px;
  border:3px solid var(--gold);
  margin-bottom:1rem;
}
h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
.tagline{font-family:'Bebas Neue';color:var(--gold)}

/* MENU */
#menu{max-width:1200px;margin:auto;padding:4rem 5%}
.section-title{
  font-family:'Bebas Neue';
  font-size:2.4rem;
  color:var(--gold);
  margin:2rem 0 1rem;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.2rem;
}
.menu-item{
  background:#0f0f0f;
  border-radius:12px;
  border:1px solid #222;
  overflow:hidden;
}
.menu-item img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-bottom:3px solid var(--gold);
}
.card{padding:1rem}
.menu-item h3{font-family:'Bebas Neue';color:var(--gold)}
.price{font-family:'Bebas Neue';color:var(--gold2)}

/* FOOTER */
footer{
  background:#000;
  padding:2rem;
  text-align:center;
  border-top:1px solid #222;
  color:#999;
}

/* EDITOR */
#editor{
  background:#0f0f0f;
  border-top:3px dashed var(--gold);
  padding:3rem 5%;
}
.editor-block{
  background:#1e1e1e;
  padding:1.5rem;
  border-radius:12px;
  margin-bottom:2rem;
}
label{display:block;margin-top:1rem;color:var(--gold)}
input,textarea{
  width:100%;
  padding:10px;
  background:#222;
  border:1px solid #444;
  color:#fff;
  border-radius:6px;
}
textarea{resize:vertical}
button{
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  border:none;
  padding:10px 18px;
  border-radius:30px;
  font-family:'Bebas Neue';
  font-size:1.1rem;
  cursor:pointer;
  margin-top:10px;
}
.remove{background:#900;color:#fff}
.section-head{display:flex;gap:10px;align-items:center}
.section-head input{flex:1}

/* WHATSAPP */
#whatsappOrderBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:999;
  background:linear-gradient(180deg,#25D366,#1ebe5d);
  color:#071010;
  padding:14px 22px;
  border-radius:40px;
  font-family:'Bebas Neue';
  font-size:1.2rem;
  text-decoration:none;
}
</style>
</head>

<body>

<header id="header">
  <img id="logo" class="logo">
  <h1 id="cafeName">YOUR CAFÉ</h1>
  <p id="tagline" class="tagline">FOOD • DRINKS • VIBES</p>
</header>

<section id="menu">
  <div id="menuRender"></div>
</section>

<footer>
  <p id="footerText">© 2026 YOUR CAFÉ</p>
</footer>

<div id="editor">
  <h2 style="font-family:'Bebas Neue';color:var(--gold)">BUILDER</h2>
  <div id="menuEditor"></div>
  <button onclick="addSection()">+ ADD SECTION</button>
  <button onclick="exportSite()">DOWNLOAD WEBSITE HTML</button>
</div>

<script>
let whatsappNumber="+27660000000";
const orderState={};

let menuSections=[
  {title:"PIZZAS",items:[]}
];

function renderMenu(){
  menuRender.innerHTML='';
  menuSections.forEach(sec=>{
    const h=document.createElement('h2');
    h.className='section-title';
    h.textContent=sec.title;
    const g=document.createElement('div');
    g.className='menu-grid';
    sec.items.forEach(it=>{
      g.innerHTML+=`
        <div class="menu-item">
          <img src="${it.img}">
          <div class="card">
            <h3>${it.name}</h3>
            <p>${it.desc}</p>
            <div class="price">R${it.price}</div>
          </div>
        </div>`;
    });
    menuRender.appendChild(h);
    menuRender.appendChild(g);
  });
}

function renderEditor(){
  menuEditor.innerHTML='';
  menuSections.forEach((sec,s)=>{
    const d=document.createElement('div');
    d.className='editor-block';
    d.innerHTML=`
      <input value="${sec.title}" oninput="menuSections[${s}].title=this.value;renderMenu()">
      <button class="remove" onclick="menuSections.splice(${s},1);renderEditor();renderMenu()">✕</button>
      ${sec.items.map((it,i)=>`
        <input value="${it.name}" oninput="menuSections[${s}].items[${i}].name=this.value;renderMenu()">
        <input type="number" value="${it.price}" oninput="menuSections[${s}].items[${i}].price=this.value;renderMenu()">
        <textarea oninput="menuSections[${s}].items[${i}].desc=this.value;renderMenu()">${it.desc}</textarea>
        <input value="${it.img}" oninput="menuSections[${s}].items[${i}].img=this.value;renderMenu()">
        <button class="remove" onclick="menuSections[${s}].items.splice(${i},1);renderEditor();renderMenu()">REMOVE ITEM</button>
      `).join('')}
      <button onclick="menuSections[${s}].items.push({name:'NEW',price:0,desc:'',img:''});renderEditor();renderMenu()">+ ITEM</button>
    `;
    menuEditor.appendChild(d);
  });
}

function addSection(){
  menuSections.push({title:"NEW SECTION",items:[]});
  renderEditor();renderMenu();
}

function exportSite(){
  const clone=document.documentElement.cloneNode(true);

  clone.querySelector('#editor')?.remove();

  const script=[...clone.querySelectorAll('script')].pop();
  script.textContent=`
    const menuSections=${JSON.stringify(menuSections)};
    (${renderMenu.toString()})();
  `;

  const html='<!DOCTYPE html>'+clone.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cafe-webstore.html';
  a.click();
}

renderEditor();
renderMenu();
</script>

</body>
</html>
