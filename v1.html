<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Café Webstore</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- SOCIAL / PWA STAMP -->
<meta property="og:title" content="Online Café Menu">
<meta property="og:description" content="Order directly via WhatsApp">
<meta property="og:image" id="ogImage" content="">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
:root{--gold:#d4a373;--gold2:#f1b86b}

/* HEADER */
header{
  min-height:80vh;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
header::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}
header *{position:relative;z-index:2}
.logo{
  max-width:180px;
  border-radius:16px;
  border:3px solid var(--gold);
  margin-bottom:1rem;
}
h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
.tagline{font-family:'Bebas Neue';color:var(--gold)}

/* MENU */
#menu{max-width:1200px;margin:auto;padding:4rem 5%}
.section-title{
  font-family:'Bebas Neue';
  font-size:2.4rem;
  color:var(--gold);
  margin:2rem 0 1rem;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.2rem;
}
.menu-item{
  background:#0f0f0f;
  border-radius:12px;
  border:1px solid #222;
  overflow:hidden;
}
.menu-item img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-bottom:3px solid var(--gold);
}
.card{padding:1rem}
.menu-item h3{font-family:'Bebas Neue';color:var(--gold)}
.price{font-family:'Bebas Neue';color:var(--gold2)}

/* FOOTER */
footer{
  background:#000;
  padding:2rem;
  text-align:center;
  border-top:1px solid #222;
  color:#999;
}

/* EDITOR */
#editor{
  background:#0f0f0f;
  border-top:3px dashed var(--gold);
  padding:3rem 5%;
}
.editor-block{
  background:#1e1e1e;
  padding:1.5rem;
  border-radius:12px;
  margin-bottom:2rem;
}
label{display:block;margin-top:1rem;color:var(--gold)}
input,textarea{
  width:100%;
  padding:10px;
  background:#222;
  border:1px solid #444;
  color:#fff;
  border-radius:6px;
}
textarea{resize:vertical}
button{
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  border:none;
  padding:10px 18px;
  border-radius:30px;
  font-family:'Bebas Neue';
  font-size:1.1rem;
  cursor:pointer;
  margin-top:10px;
}
.remove{background:#900;color:#fff}
.section-head{display:flex;gap:10px;align-items:center}
.section-head input{flex:1}

/* WHATSAPP */
#whatsappOrderBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:999;
  background:linear-gradient(180deg,#25D366,#1ebe5d);
  color:#071010;
  padding:14px 22px;
  border-radius:40px;
  font-family:'Bebas Neue';
  font-size:1.2rem;
  text-decoration:none;
}
</style>
</head>

<body>

<header id="header">
  <img id="logo" class="logo">
  <h1 id="cafeName">YOUR CAFÉ</h1>
  <p id="tagline" class="tagline">FOOD • DRINKS • VIBES</p>
</header>

<section id="menu">
  <div id="menuRender"></div>
</section>

<footer>
  <p id="footerText">© 2026 YOUR CAFÉ</p>
</footer>

<div id="editor">
<h2 style="font-family:'Bebas Neue';color:var(--gold)">BUSINESS INFO</h2>

<div class="editor-block">
  <label>Café Name</label>
  <input oninput="cafeName.textContent=this.value">
  <label>Tagline</label>
  <input oninput="tagline.textContent=this.value">
  <label>Logo Upload</label>
  <input type="file" accept="image/*" onchange="uploadImage(this,img=>logo.src=img)">
  <label>Banner Upload (Stamp Image)</label>
  <input type="file" accept="image/*" onchange="uploadImage(this,img=>{
    header.style.backgroundImage=`url('${img}')`;
    updateStamp(img);
  })">
  <label>Footer Text</label>
  <input oninput="footerText.textContent=this.value">
  <label>WhatsApp Number</label>
  <input value="+27660000000" oninput="whatsappNumber=this.value.replace(/[^0-9+]/g,'')">
</div>

<h2 style="font-family:'Bebas Neue';color:var(--gold)">MENU BUILDER</h2>
<div id="menuEditor"></div>

<button onclick="addSection()">+ ADD SECTION</button>
<button onclick="downloadHTML()">DOWNLOAD WEBSITE HTML</button>
</div>

<script>
let whatsappNumber="+27660000000";
const orderState={};

const menuSections=[
  { title:"PIZZAS", items:[
    {name:"CHEESE PIZZA",price:120,desc:"Classic cheese pizza",img:""}
  ]}
];

function updateStamp(img){
  document.querySelector('meta[property="og:image"]').content = img;
  document.querySelector('meta[name="twitter:image"]').content = img;
}

function uploadImage(input,cb){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>cb(e.target.result);
  r.readAsDataURL(f);
}

function renderMenu(){
  menuRender.innerHTML='';
  menuSections.forEach((sec,s)=>{
    const h2=document.createElement('h2');
    h2.className='section-title';
    h2.textContent=sec.title;

    const grid=document.createElement('div');
    grid.className='menu-grid';

    sec.items.forEach((it,i)=>{
      const key=`${s}-${i}`;
      const qty=orderState[key]||0;
      const d=document.createElement('div');
      d.className='menu-item';
      d.innerHTML=`
        <img src="${it.img}">
        <div class="card">
          <h3>${it.name}</h3>
          <p>${it.desc}</p>
          <div class="price">R${it.price}</div>
          <div style="display:flex;gap:10px;margin-top:10px">
            <button onclick="changeQty('${key}',-1)">−</button>
            <strong>${qty}</strong>
            <button onclick="changeQty('${key}',1)">+</button>
          </div>
        </div>`;
      grid.appendChild(d);
    });

    menuRender.appendChild(h2);
    menuRender.appendChild(grid);
  });
  renderWhatsapp();
}

function changeQty(key,d){
  orderState[key]=(orderState[key]||0)+d;
  if(orderState[key]<0) orderState[key]=0;
  renderMenu();
}

function renderWhatsapp(){
  const total=Object.values(orderState).reduce((a,b)=>a+b,0);
  let btn=document.getElementById('whatsappOrderBtn');
  if(total===0){ if(btn) btn.remove(); return; }

  let msg="Hi! I'd like to order:\n\n";
  let grand=0;

  menuSections.forEach((sec,s)=>{
    sec.items.forEach((it,i)=>{
      const q=orderState[`${s}-${i}`]||0;
      if(q){
        const t=q*it.price;
        grand+=t;
        msg+=`${q} x ${it.name} – R${t}\n${it.desc}\n\n`;
      }
    });
  });
  msg+=`Estimated total: R${grand}`;

  if(!btn){
    btn=document.createElement('a');
    btn.id='whatsappOrderBtn';
    document.body.appendChild(btn);
  }
  btn.href=`https://wa.me/${whatsappNumber}?text=`+encodeURIComponent(msg);
  btn.textContent=`ORDER NOW (${total})`;
}

function renderEditor(){
  menuEditor.innerHTML='';
  menuSections.forEach((sec,s)=>{
    const b=document.createElement('div');
    b.className='editor-block';
    b.innerHTML=`
      <div class="section-head">
        <input value="${sec.title}" oninput="menuSections[${s}].title=this.value;renderMenu()">
        <button class="remove" onclick="menuSections.splice(${s},1);renderEditor();renderMenu()">✕</button>
      </div>
      ${sec.items.map((it,i)=>`
        <label>Name</label><input value="${it.name}" oninput="menuSections[${s}].items[${i}].name=this.value;renderMenu()">
        <label>Price</label><input type="number" value="${it.price}" oninput="menuSections[${s}].items[${i}].price=this.value;renderMenu()">
        <label>Description</label><textarea oninput="menuSections[${s}].items[${i}].desc=this.value;renderMenu()">${it.desc}</textarea>
        <label>Image URL</label><input value="${it.img}" oninput="menuSections[${s}].items[${i}].img=this.value;renderMenu()">
        <label>OR Upload Image</label>
        <input type="file" accept="image/*" onchange="uploadImage(this,img=>{menuSections[${s}].items[${i}].img=img;renderMenu()})">
        <button class="remove" onclick="menuSections[${s}].items.splice(${i},1);renderEditor();renderMenu()">REMOVE ITEM</button>
      `).join('')}
      <button onclick="menuSections[${s}].items.push({name:'NEW ITEM',price:0,desc:'',img:''});renderEditor();renderMenu()">+ ADD ITEM</button>
    `;
    menuEditor.appendChild(b);
  });
}

function addSection(){
  menuSections.push({title:"NEW SECTION",items:[]});
  renderEditor();renderMenu();
}

function downloadHTML(){
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='cafe-webstore.html';
  a.click();
  URL.revokeObjectURL(url);
}

renderMenu();
renderEditor();
</script>

</body>
</html>
