<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webstore</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="TiffyAI Web-Store Builder">
<meta property="og:description" content="Create your own web-store with live preview. Order via WhatsApp. Ready in minutes.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tiffyai-usd.github.io/Web-Store-App/v2.html">

<meta property="og:image" content="https://tiffyai-usd.github.io/Web-Store-App/WebApp.gif">
<meta property="og:image:secure_url" content="https://tiffyai-usd.github.io/Web-Store-App/WebApp.gif">
<meta property="og:image:type" content="image/gif">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tiffyai-usd.github.io/Web-Store-App/WebApp.gif">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
:root{--gold:#d4a373;--gold2:#f1b86b}

/* HEADER */
header{
  min-height:80vh;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
header::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}
header *{position:relative;z-index:2}
.logo{
  max-width:180px;
  border-radius:16px;
  border:3px solid var(--gold);
  margin-bottom:1rem;
}
h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
.tagline{font-family:'Bebas Neue';color:var(--gold)}

/* MENU */
#menu{max-width:1200px;margin:auto;padding:4rem 5%}
.section-title{
  font-family:'Bebas Neue';
  font-size:2.4rem;
  color:var(--gold);
  margin:2rem 0 1rem;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.2rem;
}
.menu-item{
  background:#0f0f0f;
  border-radius:12px;
  border:1px solid #222;
  overflow:hidden;
}
.menu-item img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-bottom:3px solid var(--gold);
}
.card{padding:1rem}
.menu-item h3{font-family:'Bebas Neue';color:var(--gold)}
.price{font-family:'Bebas Neue';color:var(--gold2)}

/* FOOTER */
footer{
  background:#000;
  padding:2rem;
  text-align:center;
  border-top:1px solid #222;
  color:#999;
}

/* EDITOR */
#editor{
  background:url('silky.jpeg') center / cover no-repeat;
  border-top:3px dashed var(--gold);
  padding:3rem 5%;
}
.editor-block{
  background:rgba(20,20,20,0.92);
  padding:1.5rem;
  border-radius:14px;
  margin-bottom:2rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}
label{display:block;margin-top:1rem;color:var(--gold)}
input,textarea,select{
  width:100%;
  padding:10px;
  background:#222;
  border:1px solid #444;
  color:#fff;
  border-radius:6px;
}
textarea{resize:vertical}
button{
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  border:none;
  padding:10px 18px;
  border-radius:30px;
  font-family:'Bebas Neue';
  font-size:1.1rem;
  cursor:pointer;
  margin-top:10px;
}
.remove{background:#900;color:#fff}
.section-head{display:flex;gap:10px;align-items:center}
.section-head input{flex:1}

/* WHATSAPP */
#whatsappOrderBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:999;
  background:linear-gradient(180deg,#25D366,#1ebe5d);
  color:#071010;
  padding:14px 22px;
  border-radius:40px;
  font-family:'Bebas Neue';
  font-size:1.2rem;
  text-decoration:none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.item-whatsapp-btn {
  background: #25D366;
  border: none;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 8px;
  text-decoration: none !important;
  transition: transform 0.2s;
}
.item-whatsapp-btn:hover { transform: scale(1.1); }
.item-whatsapp-btn img {
  width: 28px;
  height: 28px;
  display: block;
}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2000;
}
.hidden{display:none}
.modal-glass{
  width:90%;
  max-width:420px;
  background:rgba(20,20,20,0.85);
  backdrop-filter:blur(14px);
  border:1px solid rgba(212,163,115,0.4);
  border-radius:20px;
  padding:2rem;
  color:#fff;
  box-shadow:0 0 40px rgba(212,163,115,0.25);
}
.pay-btn{
  width:100%;
  padding:14px;
  border-radius:40px;
  margin-top:12px;
  font-family:'Bebas Neue';
  font-size:1.1rem;
  cursor:pointer;
  border:none;
}
.paypal{ background:#ffc439; color:#111; }
.confirm{ background:var(--gold); color:#111; }
.ghost{ background:transparent; border:1px solid #555; color:#aaa; }

.activation{
  max-width:600px;
  margin:3rem auto;
  padding:2rem;
  border-top:1px dashed var(--gold);
  text-align:center;
}
.code-inputs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:1.5rem;
}
.code-inputs input{
  width:42px;
  height:52px;
  text-align:center;
  font-size:1.4rem;
  border-radius:8px;
  background:#111;
  border:1px solid #444;
  color:#fff;
}
</style>
</head>

<body>
<div id="paymentModal" class="modal hidden">
  <div class="modal-glass">
    <h2 style="font-family:'Bebas Neue'; color:var(--gold); text-align:center; font-size:2rem;">TiffyAI Web-Store Builder</h2>
    <p style="text-align:center; margin:1rem 0;">$30 USD (≈ R499) once-off<br>• Hosting covered for 1 year</p>
    <button class="pay-btn paypal" onclick="payWithPaypal()">Pay with PayPal</button>
    <button class="pay-btn confirm" onclick="confirmManualPayment()">I will send an EFT</button>
    <button class="pay-btn ghost" onclick="closePayment()">Cancel</button>
  </div>
</div>

<header id="header">
  <img id="logo" class="logo">
  <h1 id="cafeName">YOUR WEB STORE BUSINESS</h1>
  <p id="tagline" class="tagline">With Live Preview</p>
</header>

<section id="menu">
  <div id="menuRender"></div>
</section>

<footer>
  <p id="footerText">© 2026 YOUR BUSINESS</p>
</footer>

<div id="activationPanel" class="activation">
  <h3 style="font-family:'Bebas Neue'; color:var(--gold); font-size:2rem;">Activate Your Web-Store</h3>
  <p style="color:#ccc; margin-bottom:1rem;">Enter the 7-digit activation key received from the admin.</p>
  <div class="code-inputs">
    <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
  </div>
  <button onclick="submitActivation()">Activate & Unlock Download</button>
</div>
 
<div id="editor">
<h2 style="font-family:'Bebas Neue';color:var(--gold)">BUSINESS INFO</h2>
<div class="editor-block">
  <label>Business Name</label>
  <input oninput="document.getElementById('cafeName').textContent=this.value">
  <label>Tagline</label>
  <input oninput="document.getElementById('tagline').textContent=this.value">
  <label>Logo URL</label>
  <input id="logoUrl" placeholder="https://example.com/logo.png" oninput="updateLogoUrl(this.value)">
  <label>Banner URL</label>
  <input id="bannerUrl" placeholder="https://example.com/banner.jpg" oninput="updateBannerUrl(this.value)">
  <label>WhatsApp Number</label>
  <input value="+27660000000" oninput="whatsappNumber=this.value.replace(/[^0-9+]/g,'')">
  <label>Currency</label>
  <select id="currencySelector" onchange="setCurrency(this.value)">
      </select>
</div>

<h2 style="font-family:'Bebas Neue';color:var(--gold)">MENU BUILDER</h2>
<div id="menuEditor"></div>
<button onclick="addSection()">+ ADD SECTION</button>
<button onclick="downloadHTML()">DOWNLOAD WEBSITE HTML</button>
</div>

<script>
/* ================== STATE ================== */
let whatsappNumber = "+27660000000";
let logoUrl = "";
let bannerUrl = "";
let activeCurrency = localStorage.getItem('tiffyai_currency') || 'ZAR';
const orderState = {};

const currencyMap = {
  ZAR: { symbol: 'R', label: 'South Africa (R)' },
  USD: { symbol: '$', label: 'USA ($)' },
  EUR: { symbol: '€', label: 'Europe (€)' },
  GBP: { symbol: '£', label: 'UK (£)' },
  NGN: { symbol: '₦', label: 'Nigeria (₦)' },
  KES: { symbol: 'KSh', label: 'Kenya (KSh)' },
  GHS: { symbol: 'GH₵', label: 'Ghana (GH₵)' },
  AUD: { symbol: 'A$', label: 'Australia ($)' },
  CAD: { symbol: 'C$', label: 'Canada ($)' },
  INR: { symbol: '₹', label: 'India (₹)' },
  JPY: { symbol: '¥', label: 'Japan (¥)' }
};

function setCurrency(code){
  activeCurrency = code;
  localStorage.setItem('tiffyai_currency', code);
  renderMenu();
  renderEditor();
}

let menuSections = [
  {
    title: "Products",
    items: [{ name: 'New Product', price: 100, desc: "Product description", img: "" }]
  }
];

/* ================== HELPERS ================== */
function updateLogoUrl(val) {
  logoUrl = val.trim();
  if (logoUrl) document.getElementById('logo').src = logoUrl;
}

function updateBannerUrl(val) {
  bannerUrl = val.trim();
  if (bannerUrl) document.getElementById('header').style.backgroundImage = `url('${bannerUrl}')`;
}

/* ================== MENU RENDER ================== */
function renderMenu(){
  const menuRender = document.getElementById('menuRender');
  menuRender.innerHTML = '';
  const sym = currencyMap[activeCurrency].symbol;

  menuSections.forEach((sec, s) => {
    const h2 = document.createElement('h2');
    h2.className = 'section-title';
    h2.textContent = sec.title;

    const grid = document.createElement('div');
    grid.className = 'menu-grid';

    sec.items.forEach((it, i) => {
      const key = `${s}-${i}`;
      const qty = orderState[key] || 0;
      const isNegotiable = !it.price || it.price == 0;

      const card = document.createElement('div');
      card.className = 'menu-item';
      card.innerHTML = `
        <img src="${it.img || 'https://via.placeholder.com/300x200?text=No+Image'}">
        <div class="card">
          <h3>${it.name}</h3>
          <p>${it.desc}</p>
          <div class="price">${isNegotiable ? 'Negotiable' : sym + it.price}</div>
          <div style="display:flex;gap:10px;margin-top:10px;align-items:center">
            ${isNegotiable ? 
              `<a class="item-whatsapp-btn" href="https://wa.me/${whatsappNumber}?text=${encodeURIComponent('Interested in: '+it.name)}" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
              </a>` : 
              `<button onclick="changeQty('${key}', -1)">−</button>
               <strong>${qty}</strong>
               <button onclick="changeQty('${key}', 1)">+</button>`
            }
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    menuRender.appendChild(h2);
    menuRender.appendChild(grid);
  });
  renderWhatsapp();
}

function changeQty(key, delta){
  orderState[key] = Math.max(0, (orderState[key] || 0) + delta);
  renderMenu();
}

function renderWhatsapp(){
  const totalQty = Object.values(orderState).reduce((a,b)=>a+b,0);
  let btn = document.getElementById('whatsappOrderBtn');
  if (totalQty === 0) { if(btn) btn.remove(); return; }

  const sym = currencyMap[activeCurrency].symbol;
  let msg = "New Order:\n\n";
  let grandTotal = 0;

  menuSections.forEach((sec, s)=>{
    sec.items.forEach((it, i)=>{
      const q = orderState[`${s}-${i}`] || 0;
      if(q > 0){
        const lineTotal = q * it.price;
        grandTotal += lineTotal;
        msg += `${q}x ${it.name} (${sym}${lineTotal})\n`;
      }
    });
  });
  msg += `\nTotal: ${sym}${grandTotal}`;

  if(!btn){
    btn = document.createElement('a');
    btn.id = 'whatsappOrderBtn';
    document.body.appendChild(btn);
  }
  btn.href = `https://wa.me/${whatsappNumber}?text=` + encodeURIComponent(msg);
  btn.textContent = `ORDER NOW (${totalQty})`;
}

/* ================== EDITOR ================== */
function renderEditor(){
  const menuEditor = document.getElementById('menuEditor');
  const sel = document.getElementById('currencySelector');
  
  // Update Selector
  sel.innerHTML = Object.entries(currencyMap).map(([code, c]) => 
    `<option value="${code}" ${activeCurrency===code?'selected':''}>${c.label}</option>`
  ).join('');

  menuEditor.innerHTML = '';
  menuSections.forEach((sec, s)=>{
    const block = document.createElement('div');
    block.className = 'editor-block';
    block.innerHTML = `
      <div class="section-head">
        <input value="${sec.title}" oninput="menuSections[${s}].title=this.value;renderMenu()">
        <button class="remove" onclick="menuSections.splice(${s},1);renderEditor();renderMenu()">✕</button>
      </div>
      ${sec.items.map((it,i)=>`
        <div style="border:1px solid #333; padding:10px; margin-top:10px; border-radius:8px;">
          <label>Item Name</label><input value="${it.name}" oninput="menuSections[${s}].items[${i}].name=this.value;renderMenu()">
          <label>Price</label><input type="number" value="${it.price}" oninput="menuSections[${s}].items[${i}].price=this.value;renderMenu()">
          <label>Image URL</label><input value="${it.img}" oninput="menuSections[${s}].items[${i}].img=this.value;renderMenu()">
          <button class="remove" style="width:100%" onclick="menuSections[${s}].items.splice(${i},1);renderEditor();renderMenu()">Remove Item</button>
        </div>
      `).join('')}
      <button onclick="menuSections[${s}].items.push({name:'New Item',price:0,desc:'',img:''});renderEditor();renderMenu()">+ Add Item</button>
    `;
    menuEditor.appendChild(block);
  });
}

function addSection(){
  menuSections.push({ title: "New Section", items: [] });
  renderEditor(); renderMenu();
}

/* ================== EXPORT ================== */
function actualDownload(){
  const doc = document.documentElement.cloneNode(true);
  doc.querySelector('#editor')?.remove();
  doc.querySelector('#paymentModal')?.remove();
  doc.querySelector('#activationPanel')?.remove();

  const script = Array.from(doc.querySelectorAll('script')).find(s => s.textContent.includes('const menuSections'));
  if(script){
    let content = script.textContent;
    content = content.replace(/let activeCurrency\s*=\s*[^;]*;/, `let activeCurrency = "${activeCurrency}";`);
    content = content.replace(/let whatsappNumber\s*=\s*[^;]*;/, `let whatsappNumber = "${whatsappNumber}";`);
    content = content.replace(/let menuSections\s*=\s*\[[\s\S]*?\];/, `let menuSections = ${JSON.stringify(menuSections)};`);
    script.textContent = content;
  }

  const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MyWebStore.html';
  a.click();
}

/* ================== ACTIVATION ================== */
function generateRequestCode(){
  let d = ''; while(d.length < 14) d += Math.floor(Math.random()*10);
  let store = JSON.parse(localStorage.getItem('tiffyai_req') || '[]');
  store.push(d); localStorage.setItem('tiffyai_req', JSON.stringify(store));
  return d.match(/.{1,4}/g).join('-');
}
function submitActivation(){
  const entered = Array.from(document.querySelectorAll('.code-inputs input')).map(i=>i.value).join('');
  const store = JSON.parse(localStorage.getItem('tiffyai_req') || '[]');
  const valid = store.some(d => {
    let key = ''; for(let i=0; i<d.length; i+=2) key += d[i];
    return key === entered;
  });
  if(valid){
    localStorage.setItem('tiffyai_activated', 'true');
    location.reload();
  } else { alert('Invalid Key'); }
}

function downloadHTML(){
  if(localStorage.getItem('tiffyai_activated') === 'true') { actualDownload(); }
  else { 
    const code = generateRequestCode();
    window.open(`https://wa.me/27766314246?text=Requesting Activation. Code: ${code}`, '_blank');
    document.getElementById('paymentModal').classList.remove('hidden'); 
  }
}
function closePayment(){ document.getElementById('paymentModal').classList.add('hidden'); }

/* ================== INIT ================== */
document.addEventListener('DOMContentLoaded', () => {
  if(localStorage.getItem('tiffyai_activated') === 'true') document.getElementById('activationPanel').remove();
  renderMenu();
  renderEditor();
});
</script>
</body>
</html>
