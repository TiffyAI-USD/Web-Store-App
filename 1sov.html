<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webstore Pro - Sovereign Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e6e6e6}
    :root{
        --gold: #d4a373;
        --gold2: #f1b86b;
        --whatsapp: #25D366;
        --gold-gradient: linear-gradient(180deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#aa771c);
    }
    /* Sovereign UI Overlays */
    .ai-highlight{outline:6px solid var(--gold)!important;transform:scale(1.02);transition:0.3s;box-shadow:0 0 20px var(--gold);z-index:9999;position:relative}
    .input-inactive{opacity:0.3;pointer-events:none;transition:opacity 0.5s}
    #aiOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:10000;justify-content:center;align-items:center;flex-direction:column;opacity:0;transition:opacity 0.5s ease}
    #floatingDownload{position:fixed;bottom:20px;left:20px;z-index:9999;background:#000;color:var(--gold);padding:12px 20px;border:2px solid var(--gold);border-radius:30px;font-family:'Bebas Neue';cursor:pointer;font-size:1rem;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
    #scannerModal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column;padding:20px}
    #paymentLanding{background:#1a1a1a;padding:20px;border:2px solid var(--gold);border-radius:12px;text-align:center;width:90%;max-width:400px}
    #supportFloating{position:fixed;bottom:20px;right:20px;z-index:9998;cursor:pointer}
    #supportFloating img{width:60px;height:60px;border-radius:50%;border:2px solid var(--gold)}
    #autoSaveStatus{position:fixed;top:10px;left:10px;z-index:5000;font-size:0.7rem;background:rgba(0,0,0,0.7);padding:4px 10px;border-radius:20px;border:1px solid var(--gold);color:var(--gold);display:none}
    
    /* Hard-Anchored Header */
    header{min-height:80vh;width:100%;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
    header::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.6)}
    header *{position:relative;z-index:2}
    .logo{max-width:180px;border-radius:16px;border:3px solid var(--gold);margin-bottom:1rem;cursor:pointer}
    h1{font-family:'Bebas Neue';font-size:4rem;color:var(--gold)}
    .tagline{font-family:'Bebas Neue';color:var(--gold);padding:0 5%}
    .cta-container{margin-top:25px;z-index:10}
    .btn-cta{display:inline-block;background:var(--gold-gradient);color:#000;padding:12px 28px;border-radius:50px;font-family:'Bebas Neue';text-decoration:none;font-size:1.2rem;box-shadow:0 4px 15px rgba(212,163,115,0.4);font-weight:bold}
    
    /* Menu & Grid */
    #menu{max-width:1200px;margin:auto;padding:4rem 5%}
    .section-title{font-family:'Bebas Neue';font-size:2.4rem;color:var(--gold);margin:2rem 0 1rem}
    .menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;width:100%}
    .menu-item{background:#0f0f0f;border-radius:12px;border:1px solid #222;overflow:hidden;position:relative}
    .menu-item img{width:100%;height:200px;object-fit:cover;border-bottom:3px solid var(--gold);cursor:pointer}
    .card{padding:1rem}
    .menu-item h3{font-family:'Bebas Neue';color:var(--gold)}
    .price{font-family:'Bebas Neue';color:var(--gold2)}
    .qr-img{width:80px;height:80px;margin-top:10px;border:1px solid #fff;cursor:pointer}
    
    /* Editor Section */
    #editor{position:relative;border-top:3px dashed var(--gold);padding:3rem 5%;background:#050505}
    .editor-block{background:rgba(20,20,20,0.9);padding:1.5rem;border-radius:14px;margin-bottom:2rem;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
    #zoomModal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999}
    #zoomModal img{max-width:90%;max-height:90%}
    label{display:block;margin-top:1rem;color:var(--gold)}
    input,textarea,select{width:100%;padding:10px;background:#222;border:1px solid #444;color:#fff;border-radius:6px}
    button{background:var(--gold-gradient);border:none;padding:10px 18px;border-radius:30px;font-family:'Bebas Neue';font-size:1.1rem;cursor:pointer;margin:5px;color:#000;font-weight:bold}
    .remove{background:#900!important;color:#fff!important}
    .btn-small{font-size:0.8rem;padding:5px 10px;margin-top:10px;display:inline-block}
</style>
</head>
<body>

<div id="aiOverlay"><div style="width:300px;height:300px;border-radius:50%;overflow:hidden;border:4px solid var(--gold);margin-bottom:20px;"><video id="aiVideo" playsinline loop style="width:100%;height:100%;object-fit:cover;"><source src="TiffyAI-Business-Hub.mp4" type="video/mp4"></video></div><p id="aiMsg" style="font-family:'Bebas Neue';color:var(--gold);font-size:1.5rem;text-align:center;padding:0 20px;"></p><div id="aiChoiceContainer" style="margin-top:20px;"></div></div>

<div id="aiBtnContainer" style="position:fixed;top:20px;right:20px;z-index:9997;"><button onclick="startAiMode()">AI BUILDER</button></div>
<div id="floatingDownload" onclick="downloadHTML()">💾 DOWNLOAD</div>
<div id="scannerModal"><div id="paymentLanding"><h2 id="amountDisplay" style="color:var(--gold);margin-bottom:15px;">Confirm Payment</h2><button onclick="confirmAndPay()">CONFIRM & PAY</button><button class="remove" onclick="stopScanner()">CANCEL</button></div></div>
<div id="zoomModal" onclick="this.style.display='none'"><img id="zoomImg"></div>
<div id="supportFloating" onclick="enterMarketplace()"><img src="support.png" onerror="this.style.display='none'"></div>
<div id="autoSaveStatus">Saved Draft</div>

<header id="header">
  <img id="logo" class="logo" onclick="zoom(this.src)">
  <h1 id="cafeName">Create your Store In Mere Minutes</h1>
  <p id="tagline" class="tagline"></p>
  <div class="cta-container"><a href="#" id="ctaBtn" class="btn-cta">Powered By TiffyAI</a></div>
</header>
<section id="menu"><div id="menuRender"></div></section>
<footer><p id="footerText" style="text-align:center;padding:20px;color:#666;">© 2026 YOUR BUSINESS</p></footer>

<div id="editor">
    <h2 style="font-family:'Bebas Neue';color:var(--gold)">GLOBAL SETTINGS</h2>
    <div class="editor-block">
        <label>Store Currency</label>
        <select id="editCurrency" onchange="saveDraft(); renderMenu()">
            <option value="USD">USD ($)</option><option value="ZAR">ZAR (R)</option><option value="EUR">EUR (€)</option><option value="NGN">NGN (₦)</option><option value="INR">INR (₹)</option><option value="CNY">CNY (¥)</option><option value="AUD">AUD ($)</option>
        </select>
    </div>
    <h2 style="font-family:'Bebas Neue';color:var(--gold)">BUSINESS INFO</h2>
    <div class="editor-block">
      <label>1. Upload Business Logo</label><input type="file" id="editLogo" onchange="uploadImage(this, img=>{document.getElementById('logo').src=img; saveDraft()})">
      <label>2. Upload Banner Image</label><input type="file" id="editBanner" onchange="uploadImage(this, img=>{document.getElementById('header').style.backgroundImage='url('+img+')'; saveDraft()})">
      <label>3. Business Name</label><input id="editName" oninput="document.getElementById('cafeName').textContent=this.value;saveDraft()">
      <label>4. Tagline</label><textarea id="editTag" oninput="document.getElementById('tagline').textContent=this.value;saveDraft()"></textarea>
      <label>5. WhatsApp Number</label><input id="editPhone" placeholder="27xxxxxxxx" oninput="saveDraft()">
      <label>6. CTA Button Text</label><input id="editCtaText" value="ORDER NOW" oninput="document.getElementById('ctaBtn').textContent=this.value;saveDraft()">
      <label>7. CTA Button Link</label><input id="editCtaLink" placeholder="https://..." oninput="document.getElementById('ctaBtn').href=this.value;saveDraft()">
      <label>8. Footer Text</label><input id="editFooter" oninput="document.getElementById('footerText').textContent=this.value;saveDraft()">
    </div>
    <h2 style="font-family:'Bebas Neue';color:var(--gold)">MENU BUILDER</h2>
    <div id="menuEditor"></div>
    <button onclick="addSection()">+ ADD SECTION</button>
</div>

<script>
const DEFAULT_TAG = "Sovereign business suite. No third-party servers. Your store, your data, your control.";
const DB_NAME = 'TiffyStoreDB'; const STORE_NAME = 'StoreData';
let menuSections = [{ title: "Products", items: [{ name: 'Item', price: 10, desc: "Description", img: "", qr: "", qty: 0 }] }];

async function applyState(d) {
    if (!d) return;
    if (d.menu) menuSections = d.menu;
    document.getElementById('cafeName').textContent = d.name || "Your Store";
    document.getElementById('tagline').textContent = d.tag || DEFAULT_TAG;
    document.getElementById('editPhone').value = d.phone || "";
    document.getElementById('ctaBtn').textContent = d.ctaText || "ORDER NOW";
    document.getElementById('ctaBtn').href = d.ctaLink || "#";
    document.getElementById('footerText').textContent = d.footer || "© 2026 BUSINESS";
    if(d.logo) document.getElementById('logo').src = d.logo;
    if(d.banner) document.getElementById('header').style.backgroundImage = d.banner;
    renderMenu(); renderEditor();
}

document.addEventListener('DOMContentLoaded', async () => {
    if (typeof INITIAL_STATE !== 'undefined') { await applyState(INITIAL_STATE); } 
    else { const d = localStorage.getItem('webstore_pro_draft'); if(d) await applyState(JSON.parse(d)); }
});

function saveDraft() {
    const data = { name: document.getElementById('cafeName').textContent, tag: document.getElementById('tagline').textContent, phone: document.getElementById('editPhone').value, ctaText: document.getElementById('ctaBtn').textContent, ctaLink: document.getElementById('ctaBtn').href, footer: document.getElementById('footerText').textContent, menu: menuSections, currency: document.getElementById('editCurrency').value, logo: document.getElementById('logo').src, banner: document.getElementById('header').style.backgroundImage };
    localStorage.setItem('webstore_pro_draft', JSON.stringify(data));
    document.getElementById('autoSaveStatus').style.display = 'block';
    setTimeout(() => document.getElementById('autoSaveStatus').style.display = 'none', 2000);
}

function uploadImage(input, cb) { const r = new FileReader(); r.onload = e => { cb(e.target.result); saveDraft(); }; r.readAsDataURL(input.files[0]); }

function renderMenu() {
    const container = document.getElementById('menuRender'); container.innerHTML = '';
    menuSections.forEach(sec => {
        container.innerHTML += `<h2 class="section-title">${sec.title}</h2>`;
        const grid = document.createElement('div'); grid.className = 'menu-grid';
        sec.items.forEach((it) => {
            grid.innerHTML += `<div class="menu-item">${it.img ? `<img src="${it.img}" onclick="zoom(this.src)">` : ''}<div class="card"><h3>${it.name}</h3><p>${it.desc}</p><div class="price">${it.price}</div><button class="btn-small" onclick="alert('Added')">Add to Cart</button></div></div>`;
        });
        container.appendChild(grid);
    });
}

function downloadHTML() {
    const currentData = { name: document.getElementById('cafeName').textContent, tag: document.getElementById('tagline').textContent, phone: document.getElementById('editPhone').value, ctaText: document.getElementById('ctaBtn').textContent, ctaLink: document.getElementById('ctaBtn').href, footer: document.getElementById('footerText').textContent, menu: menuSections, currency: document.getElementById('editCurrency').value, logo: document.getElementById('logo').src, banner: document.getElementById('header').style.backgroundImage };
    const stateInjection = `<script>const INITIAL_STATE = ${JSON.stringify(currentData)};<\/script>`;
    document.querySelector('#editor').style.display = 'none';
    document.querySelector('#floatingDownload').style.display = 'none';
    document.querySelector('#aiBtnContainer').style.display = 'none';
    const fullHtml = document.documentElement.outerHTML.replace('</head>', stateInjection + '</head>');
    const blob = new Blob([fullHtml], {type: 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'MySovereignStore.html'; a.click();
    document.querySelector('#editor').style.display = 'block';
    document.querySelector('#floatingDownload').style.display = 'block';
    document.querySelector('#aiBtnContainer').style.display = 'block';
}

function addSection() { menuSections.push({ title: "New Section", items: [] }); renderEditor(); saveDraft(); }
function zoom(src) { document.getElementById('zoomImg').src = src; document.getElementById('zoomModal').style.display = 'flex'; }
function renderEditor() {
    const me = document.getElementById('menuEditor'); me.innerHTML = '';
    menuSections.forEach((sec, s) => {
        me.innerHTML += `<div class="editor-block"><input value="${sec.title}" oninput="menuSections[${s}].title=this.value;saveDraft()">
        ${sec.items.map((it, i) => `<div style="border:1px solid #333; margin:5px 0; padding:10px;">
        <input value="${it.name}" oninput="menuSections[${s}].items[${i}].name=this.value;saveDraft()">
        <input type="number" value="${it.price}" oninput="menuSections[${s}].items[${i}].price=this.value;saveDraft()">
        <input type="file" onchange="uploadImage(this, img=>{menuSections[${s}].items[${i}].img=img; renderMenu(); saveDraft()})"></div>`).join('')}</div>`;
    });
}
</script>
</body>
</html>
